<style>
    .mode-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; display: inline-block; }
    .bg-time { background: #f59e0b; color: #000; }
    .bg-record { background: #ec4899; color: #fff; }
</style>

<script>
    let currentMode = "CLASSIC"; // Peut être changé par db.ref('settings/gameMode')

    function validerSaisie() {
        const cNum = document.getElementById('circuitNum').value;
        const l1 = document.getElementById('l1').value.toUpperCase().trim();
        const l2 = document.getElementById('l2').value.toUpperCase().trim();
        if(!cNum || !l1 || !l2) return;

        const now = Date.now();
        const userKey = `${selectedColor}_${selectedNum}`;
        
        // RÉCUPÉRATION DU TEMPS (Fin du dernier parcours = Départ du nouveau)
        const lastTimestamp = localStorage.getItem(`lastFinish_${currentClass}_${userKey}`) || now;
        const durationSeconds = Math.floor((now - lastTimestamp) / 1000);

        const sol = CORRECTION[cNum][selectedColor];
        let pts = (l1 === sol[0] && l2 === sol[1]) || (l1 === sol[1] && l2 === sol[0]) ? 5 : (l1 === sol[0] || l1 === sol[1] || l2 === sol[0] || l2 === sol[1]) ? 2 : 0;

        // LOGIQUE DES MODES DE JEU
        let finalScore = pts;
        if(currentMode === "TIME_ATTACK" && pts === 5) {
            // Bonus vitesse : 10 pts max, on perd 0.1pt par seconde au delà de 10s
            const speedBonus = Math.max(0, 5 - (durationSeconds * 0.1));
            finalScore = (pts + speedBonus).toFixed(1);
        }

        db.ref(`sessions/${currentClass}/${userKey}/C${cNum}`).set({
            score: parseFloat(finalScore),
            time: durationSeconds,
            timestamp: now
        }).then(() => {
            localStorage.setItem(`lastFinish_${currentClass}_${userKey}`, now);
            showFeedback(finalScore, durationSeconds);
        });
    }
</script>
