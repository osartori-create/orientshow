<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orient'Show | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; }
        .input-box { background: #1e293b; border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; border-radius: 15px; width: 80px; height: 80px; text-transform: uppercase; outline: none; }
        .btn-active { background: #3b82f6 !important; border-color: white !important; transform: scale(1.05); }
        .done { opacity: 0.2; pointer-events: none; background: #020617 !important; border-color: #334155 !important;}
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body class="text-white p-4 font-sans select-none">
    <div id="app" class="max-w-md mx-auto">
        <h1 class="text-4xl font-black text-blue-500 italic text-center uppercase py-4">Orient'Show</h1>
        
        <div id="waitChrono" class="hidden text-center py-20 flex flex-col items-center justify-center">
            <div class="text-6xl animate-bounce">⏳</div>
            <h2 class="text-2xl font-black uppercase mt-6 text-slate-300">En attente du départ...</h2>
        </div>

        <div id="main">
            <select id="selectClasse" onchange="checkChrono()" class="w-full p-4 bg-slate-800 rounded-xl font-bold border border-slate-700 mb-6 text-lg outline-none"></select>
            
            <div id="stepDossard" class="space-y-4">
                <div class="grid grid-cols-5 gap-2" id="gridNums">
                    <script>for(let i=1;i<=10;i++) document.write(`<button onclick="setNum(${i})" id="btnN${i}" class="bg-slate-900 p-4 rounded-xl font-black border border-slate-700 transition-all">${i}</button>`)</script>
                </div>
                <div class="grid grid-cols-2 gap-2 font-black italic">
                    <button onclick="setColor('NOIR')" class="p-5 bg-black rounded-2xl border border-slate-600 active:scale-95 transition-transform">NOIR</button>
                    <button onclick="setColor('ROUGE')" class="p-5 bg-red-600 rounded-2xl border border-red-400 active:scale-95 transition-transform">ROUGE</button>
                    <button onclick="setColor('BLEU')" class="p-5 bg-blue-600 rounded-2xl border border-blue-400 active:scale-95 transition-transform">BLEU</button>
                    <button onclick="setColor('VERT')" class="p-5 bg-green-600 rounded-2xl border border-green-400 active:scale-95 transition-transform">VERT</button>
                    <button onclick="setColor('JAUNE')" class="p-5 bg-yellow-500 text-black rounded-2xl col-span-2 active:scale-95 transition-transform">JAUNE</button>
                </div>
            </div>

            <div id="stepSaisie" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <span id="labelDossard" class="font-black text-blue-400 uppercase tracking-widest text-lg"></span>
                    <button onclick="location.reload()" class="bg-slate-700 px-3 py-2 rounded-lg font-bold text-xs uppercase">Changer</button>
                </div>
                
                <div class="grid grid-cols-4 gap-2" id="pList">
                    <script>for(let i=1;i<=12;i++) document.write(`<button onclick="setP(${i})" id="pBtn${i}" class="p-3 bg-slate-900 rounded-lg font-black border border-slate-700 transition-all">P${i}</button>`)</script>
                </div>
                
                <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl mt-4">
                    <div class="flex justify-center gap-4 mb-6">
                        <input type="text" id="l1" class="input-box" maxlength="1" autocomplete="off" spellcheck="false">
                        <input type="text" id="l2" class="input-box" maxlength="1" autocomplete="off" spellcheck="false">
                    </div>
                    <button onclick="valider()" class="w-full bg-blue-600 p-6 rounded-2xl text-3xl font-black uppercase shadow-lg active:scale-95 transition-transform">Valider</button>
                </div>
            </div>
        </div>

        <!-- Feedback Visuel -->
        <div id="feedback" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center transition-colors duration-300">
            <div id="fbIcon" class="text-8xl mb-4"></div>
            <div id="fbPoints" class="text-7xl font-black mb-4 italic"></div>
            <div id="fbMsg" class="text-2xl font-bold mb-8"></div>
            <button onclick="document.getElementById('feedback').classList.add('hidden')" class="bg-white text-black px-10 py-4 rounded-full font-black uppercase text-xl shadow-2xl">Continuer</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        let curN, curC, curP, startT, matrix={};

        db.ref('settings/classes').on('value', snap => {
            const sel = document.getElementById('selectClasse'); sel.innerHTML = '<option value="">-- CHOISIR LA CLASSE --</option>';
            Object.keys(snap.val() || {}).forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
        });

        db.ref('settings/matrix').on('value', snap => { matrix = snap.val() || {}; });

        function checkChrono() {
            const cl = document.getElementById('selectClasse').value; if(!cl) return;
            db.ref(`settings/startTime/${cl}`).on('value', snap => {
                startT = snap.val();
                document.getElementById('waitChrono').classList.toggle('hidden', !!startT);
                document.getElementById('main').classList.toggle('hidden', !startT);
            });
        }

        function setNum(n) { curN = n; document.querySelectorAll('#gridNums button').forEach(b => b.classList.remove('btn-active')); document.getElementById('btnN'+n).classList.add('btn-active'); }
        
        function setColor(c) {
            if(!curN || !startT) return alert("Choisis ton numéro d'abord !");
            curC = c; document.getElementById('labelDossard').innerText = `${curC} ${curN}`;
            document.getElementById('stepDossard').classList.add('hidden');
            document.getElementById('stepSaisie').classList.remove('hidden');
            
            db.ref(`sessions/${document.getElementById('selectClasse').value}/${curC}_${curN}`).on('value', snap => {
                const res = snap.val() || {};
                Object.keys(res).forEach(k => document.getElementById('pBtn'+k.replace('C','')).classList.add('done'));
            });
        }
        
        function setP(p) { curP = p; document.querySelectorAll('#pList button').forEach(b => b.classList.remove('btn-active')); document.getElementById('pBtn'+p).classList.add('btn-active'); }

        function valider() {
            if(!curP) return alert("Sélectionne un circuit (P1 à P12) !");
            const cl = document.getElementById('selectClasse').value;
            const l1 = document.getElementById('l1').value.toUpperCase().trim();
            const l2 = document.getElementById('l2').value.toUpperCase().trim();
            if(!l1 && !l2) return;

            const sol = matrix[curP]?.[curC];
            let pts = 0; let msg = "Faux !"; let icon = "❌"; let bgClass = "bg-red-600";

            if(sol && ((l1==sol[0] && l2==sol[1]) || (l1==sol[1] && l2==sol[0]))) { pts = 5; msg = "Parfait !"; icon = "🏆"; bgClass = "bg-green-600"; }
            else if(sol && (l1==sol[0] || l1==sol[1] || l2==sol[0] || l2==sol[1])) { pts = 2; msg = "1 lettre juste !"; icon = "🆗"; bgClass = "bg-orange-500"; }

            db.ref(`sessions/${cl}/${curC}_${curN}/C${curP}`).set({ score: pts, time: Math.floor((Date.now()-startT)/1000) }).then(() => {
                document.getElementById('l1').value = ""; document.getElementById('l2').value = "";
                curP = null; document.querySelectorAll('#pList button').forEach(b => b.classList.remove('btn-active'));
                
                // Affichage Feedback
                const fb = document.getElementById('feedback');
                fb.className = `fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center ${bgClass}`;
                if(pts === 0) fb.classList.add('animate-shake');
                document.getElementById('fbIcon').innerText = icon;
                document.getElementById('fbPoints').innerText = `+${pts} PTS`;
                document.getElementById('fbMsg').innerText = msg;
                fb.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>CTYPE html>

<body class="text-white font-sans p-4">
    <div id="app" class="max-w-md mx-auto">
        <h1 class="text-4xl font-black text-blue-500 italic text-center uppercase py-4">Orient'Show</h1>
        
        <div id="waitChrono" class="hidden text-center py-20"><div class="text-6xl animate-pulse">⏳</div><h2 class="text-xl font-bold uppercase mt-4">En attente du départ...</h2></div>

        <div id="main">
            <select id="selectClasse" onchange="checkSession()" class="w-full p-4 bg-slate-800 rounded-xl font-bold border border-slate-700 mb-6"></select>
            
            <div id="stepIdentite" class="space-y-4">
                <div id="nomEleve" class="text-center text-2xl font-black text-yellow-400 min-h-[40px]"></div>
                <div class="grid grid-cols-5 gap-2" id="gridNums">
                    <script>for(let i=1;i<=10;i++) document.write(`<button onclick="setNum(${i})" id="btnN${i}" class="bg-slate-900 p-4 rounded-xl font-black border border-slate-700">${i}</button>`)</script>
                </div>
                <div class="grid grid-cols-2 gap-2 font-black italic">
                    <button onclick="setColor('NOIR')" class="p-5 bg-black rounded-2xl border border-slate-600">NOIR</button>
                    <button onclick="setColor('ROUGE')" class="p-5 bg-red-600 rounded-2xl border border-red-400">ROUGE</button>
                    <button onclick="setColor('BLEU')" class="p-5 bg-blue-600 rounded-2xl border border-blue-400">BLEU</button>
                    <button onclick="setColor('VERT')" class="p-5 bg-green-600 rounded-2xl border border-green-400">VERT</button>
                    <button onclick="setColor('JAUNE')" class="p-5 bg-yellow-500 text-black rounded-2xl col-span-2">JAUNE</button>
                </div>
                <button onclick="goSaisie()" class="w-full bg-blue-600 p-5 rounded-2xl font-black text-xl mt-4">C'EST BIEN MOI !</button>
            </div>

            <div id="stepSaisie" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700"><span id="idDisplay" class="font-black text-blue-400 uppercase"></span><button onclick="location.reload()" class="text-xs bg-slate-700 px-3 py-1 rounded-lg">RETOUR</button></div>
                <div class="grid grid-cols-4 gap-2" id="pList">
                    <script>for(let i=1;i<=12;i++) document.write(`<button onclick="setP(${i})" id="pBtn${i}" class="p-3 bg-slate-900 rounded-lg font-black border border-slate-700">P${i}</button>`)</script>
                </div>
                <div class="flex justify-center gap-4"><input type="text" id="l1" class="input-box" maxlength="1"><input type="text" id="l2" class="input-box" maxlength="1"></div>
                <button onclick="valider()" class="w-full bg-blue-600 p-6 rounded-2xl text-3xl font-black uppercase">Valider</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        let curN, curC, curP, startT, matrix={}, students=[], results={};

        db.ref('settings/classes').on('value', snap => {
            const sel = document.getElementById('selectClasse'); sel.innerHTML = '<option value="">-- CLASSE --</option>';
            Object.keys(snap.val() || {}).forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
        });

        db.ref('settings/matrix').on('value', snap => matrix = snap.val() || {});

        function checkSession() {
            const cl = document.getElementById('selectClasse').value; if(!cl) return;
            db.ref(`settings/startTime/${cl}`).on('value', snap => {
                startT = snap.val();
                document.getElementById('waitChrono').classList.toggle('hidden', !!startT);
                document.getElementById('main').classList.toggle('hidden', !startT);
            });
            db.ref(`classes/${cl}/students`).on('value', snap => students = snap.val() || []);
        }

        function setNum(n) { curN = n; updateNom(); document.querySelectorAll('#gridNums button').forEach(b => b.classList.remove('btn-active')); document.getElementById('btnN'+n).classList.add('btn-active'); }
        function setColor(c) { curC = c; updateNom(); }
        function updateNom() {
            if(curN && curC) {
                const s = students.find(x => x.code === `${curC}_${curN}`);
                document.getElementById('nomEleve').innerText = s ? s.first : "INCONNU";
            }
        }

        function goSaisie() {
            if(!curN || !curC) return alert("Choisis ton dossard !");
            const cl = document.getElementById('selectClasse').value;
            const uKey = `${curC}_${curN}`;
            document.getElementById('idDisplay').innerText = document.getElementById('nomEleve').innerText;
            document.getElementById('stepIdentite').classList.add('hidden');
            document.getElementById('stepSaisie').classList.remove('hidden');
            db.ref(`sessions/${cl}/${uKey}`).on('value', snap => {
                results = snap.val() || {};
                Object.keys(results).forEach(k => document.getElementById('pBtn'+k.replace('C','')).classList.add('done'));
            });
        }

        function setP(p) { curP = p; document.querySelectorAll('#pList button').forEach(b => b.classList.remove('btn-active')); document.getElementById('pBtn'+p).classList.add('btn-active'); }

        function valider() {
            const cl = document.getElementById('selectClasse').value;
            const l1 = document.getElementById('l1').value.toUpperCase();
            const l2 = document.getElementById('l2').value.toUpperCase();
            const sol = matrix[curP]?.[curC];
            let pts = 0; if(sol && ((l1==sol[0] && l2==sol[1]) || (l1==sol[1] && l2==sol[0]))) pts = 5;
            db.ref(`sessions/${cl}/${curC}_${curN}/C${curP}`).set({ score: pts, time: Math.floor((Date.now()-startT)/1000) }).then(() => location.reload());
        }
    </script>
