<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saisie Élève | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; color: white; user-select: none; overflow: hidden; }
        .input-box { background: #1e293b; border: 2px solid #334155; text-align: center; font-size: 2.5rem; font-weight: 900; border-radius: 12px; width: 65px; height: 65px; text-transform: uppercase; outline: none; }
        .btn-active { background-color: #3b82f6 !important; border-color: white !important; transform: scale(1.02); color: white !important;}
        .col-NOIR { background-color: #000000 !important; border: 2px solid #475569 !important; } 
        .col-ROUGE { background-color: #b91c1c; }
        .col-BLEU { background-color: #1d4ed8; }
        .col-VERT { background-color: #15803d; }
        .col-JAUNE { background-color: #a16207; }
        .poste-done { opacity: 0.15; pointer-events: none; background-color: #020617 !important; }
        canvas { max-height: 100px !important; }
    </style>
</head>
<body class="flex flex-col h-screen font-sans p-2">

    <header class="bg-slate-800 p-2 text-center rounded-xl border border-slate-700 shadow-md mb-2">
        <div class="flex justify-between items-center px-2">
            <h1 class="text-lg font-black italic text-blue-500 uppercase tracking-tighter">Orient'Show</h1>
            <select id="clSelect" class="bg-slate-900 border border-slate-600 text-blue-400 font-bold p-1 rounded text-xs uppercase" onchange="changerClasse()">
                <option value="">CLASSE ?</option>
            </select>
        </div>
        <div id="courseState" class="text-[10px] font-bold text-slate-500 uppercase mt-1">Sélectionne ta classe</div>
    </header>

    <main id="mainZone" class="flex-1 flex flex-col gap-2 opacity-50 pointer-events-none overflow-hidden">
        
        <div id="analysisZone" class="hidden bg-slate-900/50 rounded-xl p-2 border border-blue-900/30">
            <div class="flex justify-between text-[10px] font-bold uppercase mb-1">
                <span class="text-blue-400">Ton analyse live</span>
                <span id="scoreDisplay" class="text-white">0 PTS</span>
            </div>
            <canvas id="miniChart"></canvas>
        </div>

        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
            <div class="grid grid-cols-5 gap-1 mb-2">
                <button class="btn-color col-NOIR h-16 rounded-lg font-black text-[9px] text-white" onclick="selectColor('NOIR', this)">NOIR</button>
                <button class="btn-color col-ROUGE h-16 rounded-lg font-black text-[9px] text-white" onclick="selectColor('ROUGE', this)">ROUGE</button>
                <button class="btn-color col-BLEU h-16 rounded-lg font-black text-[9px] text-white" onclick="selectColor('BLEU', this)">BLEU</button>
                <button class="btn-color col-VERT h-16 rounded-lg font-black text-[9px] text-white" onclick="selectColor('VERT', this)">VERT</button>
                <button class="btn-color col-JAUNE h-16 rounded-lg font-black text-[9px] text-white shadow-[0_1px_2px_rgba(0,0,0,0.8)]" onclick="selectColor('JAUNE', this)">JAUNE</button>
            </div>
            <div class="grid grid-cols-5 gap-1">
                <script>
                    for(let i=1; i<=10; i++) document.write(`<button id="btnNum${i}" class="btn-num bg-slate-700 h-10 rounded-lg font-black text-sm border border-slate-600" onclick="selectNum(${i}, this)">${i}</button>`);
                </script>
            </div>
        </div>

        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex-1 flex flex-col justify-between min-h-0">
            <div class="grid grid-cols-4 gap-1">
                <script>
                    for(let i=1; i<=12; i++) document.write(`<button id="btnPoste${i}" class="btn-poste bg-slate-700 h-10 rounded-lg font-black text-sm border border-slate-600" onclick="selectPoste(${i}, this)">C${i}</button>`);
                </script>
            </div>
            
            <div class="flex justify-center items-center gap-4 my-2">
                <input type="text" id="l1" class="input-box" maxlength="1" oninput="this.value=this.value.toUpperCase(); if(this.value) document.getElementById('l2').focus()">
                <input type="text" id="l2" class="input-box" maxlength="1" oninput="this.value=this.value.toUpperCase()">
            </div>

            <button onclick="validerCode()" class="w-full py-4 bg-blue-600 active:bg-blue-800 text-white font-black text-xl rounded-xl shadow-lg uppercase tracking-widest">
                ✅ VALIDER
            </button>
        </div>
    </main>

    <div id="feedback" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center transition-all bg-slate-900/95 backdrop-blur-sm">
        <div id="fbIcon" class="text-8xl mb-4"></div>
        <div id="fbPoints" class="text-6xl font-black text-white mb-2"></div>
        <div id="fbTotal" class="text-xl font-bold text-yellow-400 mb-8"></div>
        <button onclick="fermerFeedback()" class="px-12 py-4 bg-white/10 border-2 border-white rounded-2xl text-white font-black text-xl active:scale-95 transition-transform">SUIVANT ➔</button>
    </div>

    <script>
        // 1. INIT FIREBASE & AUDIO
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let curCl = "", selectedColor = "", selectedNum = null, selectedPoste = null, isCourseActive = false;
        let startT = 0, miniChart = null, eleveListener = null;
        const antiCheat = {};

        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(f, d, t) { if (!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }

        window.onload = () => {
            db.ref('settings/classes').on('value', snap => {
                const select = document.getElementById('clSelect');
                select.innerHTML = '<option value="">CLASSE ?</option>' + Object.keys(snap.val()||{}).filter(c => c!=="true" && c!=="null").map(c => `<option value="${c}">${c}</option>`).join('');
            });
            initChart();
            document.body.addEventListener('click', initAudio, { once: true });
        };

        function initChart() {
            const ctx = document.getElementById('miniChart').getContext('2d');
            miniChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f655', borderWidth: 3, pointRadius: 5, fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: -1, max: 6, ticks: { display: false }, grid: { color: '#1e293b' } } } }
            });
        }

        // 2. LOGIQUE DE COURSE ET GESTION IDENTITÉ
        function changerClasse() {
            curCl = document.getElementById('clSelect').value;
            db.ref(`settings/startTime/${curCl}`).on('value', s => {
                startT = s.val();
                db.ref(`settings/endTime/${curCl}`).on('value', e => {
                    isCourseActive = (startT && !e.val());
                    updateUIState(startT, e.val());
                });
            });
            resetSelections();
        }

        function updateUIState(s, e) {
            const main = document.getElementById('mainZone'), state = document.getElementById('courseState');
            if(!s) { main.classList.add('opacity-50','pointer-events-none'); state.innerText = "Attente prof..."; state.className="text-[10px] font-bold text-slate-500 uppercase mt-1"; }
            else if(s && !e) { main.classList.remove('opacity-50','pointer-events-none'); state.innerText = "Course en cours 🏃‍♂️"; state.className="text-[10px] font-bold text-emerald-400 uppercase mt-1"; }
            else { main.classList.add('opacity-50','pointer-events-none'); state.innerText = "Séance terminée 🛑"; state.className="text-[10px] font-bold text-red-500 uppercase mt-1"; }
        }

        function selectColor(c, b) { selectedColor = c; document.querySelectorAll('.btn-color').forEach(x => x.classList.remove('btn-active')); b.classList.add('btn-active'); verifierBalises(); }
        function selectNum(n, b) { selectedNum = n; document.querySelectorAll('.btn-num').forEach(x => x.classList.remove('btn-active')); b.classList.add('btn-active'); verifierBalises(); }
        function selectPoste(p, b) { selectedPoste = p; document.querySelectorAll('.btn-poste').forEach(x => x.classList.remove('btn-active')); b.classList.add('btn-active'); document.getElementById('l1').focus(); }

        function verifierBalises() {
            if (curCl && selectedColor && selectedNum) {
                document.getElementById('analysisZone').classList.remove('hidden');
                if(eleveListener) eleveListener.off(); // Nettoie l'ancien listener
                eleveListener = db.ref(`sessions/${curCl}/${selectedColor}_${selectedNum}`);
                
                eleveListener.on('value', snap => {
                    const data = snap.val() || {};
                    let ptsTotal = 0, chartData = [];
                    for(let i=1; i<=12; i++) {
                        const btn = document.getElementById(`btnPoste${i}`);
                        if (data[`C${i}`]) {
                            ptsTotal += data[`C${i}`].score;
                            btn.classList.add('poste-done');
                            chartData.push({ t: data[`C${i}`].realTime, v: data[`C${i}`].score });
                            
                            // Si l'élève avait présélectionné un circuit qu'il a déjà fait, on annule
                            if (selectedPoste === i) {
                                selectedPoste = null;
                                btn.classList.remove('btn-active');
                            }
                        } else {
                            btn.classList.remove('poste-done');
                        }
                    }
                    document.getElementById('scoreDisplay').innerText = `${ptsTotal} PTS`;
                    updateMiniChart(chartData);
                });
            } else {
                document.getElementById('analysisZone').classList.add('hidden');
            }
        }

        function updateMiniChart(data) {
            data.sort((a,b) => a.t - b.t);
            miniChart.data.labels = data.map(d => "");
            miniChart.data.datasets[0].data = data.map(d => d.v);
            miniChart.update();
        }

        // 3. VALIDATION SANS ORDRE DE LETTRES
        function validerCode() {
            if(!isCourseActive) return alert("Course inactive !");
            if(!selectedColor || !selectedNum) return alert("Identifie-toi d'abord (Couleur + Numéro) !");
            if(!selectedPoste) return alert("Choisis ton circuit !");
            
            const l1 = document.getElementById('l1').value.toUpperCase();
            const l2 = document.getElementById('l2').value.toUpperCase();
            if(!l1 && !l2) return alert("Saisis au moins une lettre !");

            const key = `${curCl}_${selectedColor}_${selectedNum}`;
            const diff = (Date.now() - (antiCheat[key] || 0)) / 1000;
            if(diff < 30) return alert(`⏳ Trop rapide ! Attends encore ${Math.ceil(30-diff)}s.`);

            db.ref('settings/matrix').once('value', snap => {
                const matrix = snap.val() || {};
                const codeVerite = matrix[selectedPoste]?.[selectedColor];
                let pts = 0;

                if (codeVerite) {
                    // On clone le code pour chercher dans n'importe quel ordre sans recompter la même lettre
                    let truth = [...codeVerite]; 
                    
                    if (l1 !== "") {
                        let idx1 = truth.indexOf(l1);
                        if (idx1 !== -1) { pts += 2.5; truth.splice(idx1, 1); }
                    }
                    if (l2 !== "") {
                        let idx2 = truth.indexOf(l2);
                        if (idx2 !== -1) { pts += 2.5; truth.splice(idx2, 1); }
                    }
                    
                    pts = Math.floor(pts === 5 ? 5 : (pts > 0 ? 2 : 0));
                }

                if (pts === 5) playTone(880, 0.3, 'sine');
                else if (pts === 2) playTone(440, 0.2, 'sine');
                else playTone(150, 0.4, 'sawtooth');

                antiCheat[key] = Date.now();
                db.ref(`sessions/${curCl}/${selectedColor}_${selectedNum}/C${selectedPoste}`).set({ score: pts, realTime: Date.now() })
                .then(() => afficherFeedback(pts));
            });
        }

        // 4. FEEDBACK ET REMISE À ZÉRO TOTALE
        function afficherFeedback(p) {
            const fb = document.getElementById('feedback');
            document.getElementById('fbIcon').innerText = p===5 ? "🏆" : (p===2 ? "🆗" : "❌");
            document.getElementById('fbPoints').innerText = `+${p} PTS`;
            document.getElementById('fbTotal').innerText = `TOTAL : ${document.getElementById('scoreDisplay').innerText}`;
            fb.classList.remove('hidden');
            fb.style.backgroundColor = p===5 ? "#065f46" : (p===2 ? "#9a3412" : "#991b1b");
        }

        function fermerFeedback() { 
            document.getElementById('feedback').classList.add('hidden'); 
            resetSelections(); 
        }

        function resetSelections() {
            // Remise à zéro des champs texte
            document.getElementById('l1').value = ""; 
            document.getElementById('l2').value = "";
            
            // Remise à zéro de l'identité de l'élève
            selectedColor = ""; 
            selectedNum = null; 
            selectedPoste = null;
            
            // Masquer le graphique
            document.getElementById('analysisZone').classList.add('hidden');
            
            // Retirer tous les états visuels actifs et les grisages de circuits terminés
            document.querySelectorAll('.btn-color, .btn-num, .btn-poste').forEach(b => {
                b.classList.remove('btn-active');
                if(b.classList.contains('btn-poste')) b.classList.remove('poste-done');
            });

            // Couper la liaison avec la base de données de l'ancien élève
            if(eleveListener) {
                eleveListener.off();
                eleveListener = null;
            }
            
            // Remonter en haut de la page
            document.getElementById('mainZone').scrollTop = 0;
        }
    </script>
</body>
</html>
