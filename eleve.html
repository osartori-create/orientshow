<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orient'Show | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; }
        .letter-input { text-transform: uppercase; border: 2px solid #334155; caret-color: transparent; outline: none; }
        @keyframes flash { 0%, 100% { border-color: #3b82f6; } 50% { border-color: #ffffff; box-shadow: 0 0 20px #3b82f6; } }
        .animate-flash { animation: flash 1s infinite; border-width: 4px !important; }
    </style>
</head>
<body class="text-white font-sans p-4">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        <div id="step1" class="space-y-4">
            <h2 class="text-4xl font-black uppercase text-center py-4 text-blue-500 italic">Orient'Show</h2>
            <select id="selectClasse" class="w-full p-4 bg-slate-900 rounded-xl text-xl font-bold border border-slate-700 text-white"></select>
            <div class="grid grid-cols-5 gap-2">
                <script>for(let i=1;i<=10;i++) document.write(`<button onclick="setNum(${i})" id="btnN${i}" class="bg-slate-900 p-3 rounded-lg font-bold border border-slate-700 num-btn transition-colors">${i}</button>`)</script>
            </div>
            <div class="grid grid-cols-2 gap-3 font-black italic">
                <button onclick="selectColor('NOIR')" class="bg-black border border-slate-600 p-5 rounded-2xl">NOIR</button>
                <button onclick="selectColor('ROUGE')" class="bg-red-600 p-5 rounded-2xl">ROUGE</button>
                <button onclick="selectColor('BLEU')" class="bg-blue-600 p-5 rounded-2xl">BLEU</button>
                <button onclick="selectColor('VERT')" class="bg-green-600 p-5 rounded-2xl">VERT</button>
                <button onclick="selectColor('JAUNE')" class="bg-yellow-500 text-black p-5 rounded-2xl col-span-2">JAUNE</button>
            </div>
        </div>

        <div id="step2" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <span id="displayUser" class="font-black text-xl text-blue-400"></span>
                <button onclick="location.reload()" class="bg-slate-700 px-3 py-1 rounded-lg text-xs font-bold uppercase">Changer</button>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl">
                <select id="circuitNum" onchange="this.classList.remove('animate-flash')" class="animate-flash w-full p-6 bg-slate-900 rounded-2xl text-4xl font-black mb-8 border-2 text-center text-white">
                    <option value="" disabled selected>-- PARCOURS --</option>
                    <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">P${i}</option>`)</script>
                </select>
                <div class="flex gap-4 justify-center mb-8">
                    <input type="text" id="l1" maxlength="1" class="letter-input w-24 h-24 text-center text-6xl font-black bg-white text-slate-900 rounded-2xl">
                    <input type="text" id="l2" maxlength="1" class="letter-input w-24 h-24 text-center text-6xl font-black bg-white text-slate-900 rounded-2xl">
                </div>
                <button onclick="validerSaisie()" class="w-full bg-blue-600 p-6 rounded-2xl text-2xl font-black uppercase shadow-xl active:scale-95 transition-transform">Valider</button>
            </div>
        </div>

        <div id="feedback" class="hidden fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 p-8 text-center">
            <div id="iconScore" class="text-9xl mb-4"></div>
            <div id="msgPoints" class="text-6xl font-black mb-4 uppercase italic"></div>
            <div id="msgAlerte" class="hidden bg-red-600 p-6 rounded-2xl text-white font-black animate-pulse text-xl">⚠️ VA VOIR LE PROFESSEUR !</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let CORRECTION = {}; let selectedColor = ""; let selectedNum = ""; let currentClass = "";

        db.ref('settings/classes').on('value', snap => {
            const select = document.getElementById('selectClasse');
            select.innerHTML = '<option value="">-- CHOISIS TA CLASSE --</option>';
            if(snap.val()) Object.keys(snap.val()).forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
        });
        db.ref('settings/matrix').on('value', snap => { CORRECTION = snap.val(); });

        function setNum(n) { selectedNum = n; document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('bg-blue-600')); document.getElementById('btnN'+n).classList.add('bg-blue-600'); }
        function selectColor(color) {
            currentClass = document.getElementById('selectClasse').value;
            if(!currentClass || !selectedNum) return alert("Choisis Classe + Dossard !");
            selectedColor = color;
            document.getElementById('displayUser').innerText = `${selectedColor} ${selectedNum}`;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function validerSaisie() {
            const cNum = document.getElementById('circuitNum').value;
            const l1 = document.getElementById('l1').value.toUpperCase().trim();
            const l2 = document.getElementById('l2').value.toUpperCase().trim();
            if(!cNum || !l1 || !l2) return;
            const now = Date.now();
            const userKey = `${selectedColor}_${selectedNum}`;
            const lastFinish = localStorage.getItem(`os_last_${userKey}`) || now;
            const duration = Math.floor((now - lastFinish) / 1000);
            const sol = CORRECTION[cNum][selectedColor];
            let pts = (l1 === sol[0] && l2 === sol[1]) || (l1 === sol[1] && l2 === sol[0]) ? 5 : (l1 === sol[0] || l1 === sol[1] || l2 === sol[0] || l2 === sol[1]) ? 2 : 0;
            let hist = JSON.parse(localStorage.getItem(`os_hist_${userKey}`) || "[]");
            hist.push(pts); if(hist.length > 2) hist.shift();
            localStorage.setItem(`os_hist_${userKey}`, JSON.stringify(hist));
            db.ref(`sessions/${currentClass}/${userKey}/C${cNum}`).set({ score: pts, time: duration, timestamp: now }).then(() => {
                localStorage.setItem(`os_last_${userKey}`, now);
                showFeedback(pts, hist);
            });
        }

        function showFeedback(p, hist) {
            const fb = document.getElementById('feedback');
            document.getElementById('msgPoints').innerText = (p > 0) ? `+${p} POINTS` : "0 POINT";
            document.getElementById('iconScore').innerText = (p === 5) ? "⭐" : (p === 2) ? "🆗" : "❌";
            if(hist.length === 2 && hist[0] === 0 && hist[1] === 0) document.getElementById('msgAlerte').classList.remove('hidden');
            fb.classList.remove('hidden'); setTimeout(() => { location.reload(); }, 3000);
        }
    </script>
</body>
</html>
