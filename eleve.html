<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saisie Élève | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; color: white; user-select: none; }
        .input-box { background: #1e293b; border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; border-radius: 15px; width: 80px; height: 80px; text-transform: uppercase; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        
        /* Boutons actifs */
        .btn-active { background-color: #3b82f6 !important; border-color: white !important; transform: scale(1.05); color: white !important;}
        
        /* Couleurs d'équipes */
        .col-NOIR { background-color: #000000 !important; border-color: #475569 !important; } /* Noir absolu + bordure pour trancher avec le fond */
        .col-ROUGE { background-color: #b91c1c; }
        .col-BLEU { background-color: #1d4ed8; }
        .col-VERT { background-color: #15803d; }
        .col-JAUNE { background-color: #a16207; }
        
        /* Bouton circuit déjà validé */
        .poste-done { opacity: 0.25; pointer-events: none; background-color: #020617 !important; border-color: #1e293b !important; }
    </style>
</head>
<body class="flex flex-col h-screen font-sans">

    <header class="bg-slate-800 p-4 text-center border-b border-slate-700 shadow-md z-10">
        <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter uppercase mb-2">Orient'Show</h1>
        <select id="clSelect" class="w-full bg-slate-900 border border-slate-600 text-blue-400 font-bold p-3 rounded-lg outline-none focus:border-blue-500 text-center uppercase" onchange="changerClasse()">
            <option value="">-- CHOISIS TA CLASSE --</option>
        </select>
        <div id="courseState" class="text-xs font-bold text-slate-500 mt-2 uppercase tracking-widest">En attente de classe...</div>
    </header>

    <main id="mainZone" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 opacity-50 pointer-events-none transition-opacity duration-300">
        
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-3 text-center">1. Ton Dossard</label>
            
            <div class="grid grid-cols-5 gap-2 mb-4" id="colorGrid">
                <button class="btn-color col-NOIR h-28 rounded-xl font-black text-[10px] sm:text-xs text-white border-2 border-transparent transition-all drop-shadow-md" onclick="selectColor('NOIR', this)">NOIR</button>
                <button class="btn-color col-ROUGE h-28 rounded-xl font-black text-[10px] sm:text-xs text-white border-2 border-transparent transition-all drop-shadow-md" onclick="selectColor('ROUGE', this)">ROUGE</button>
                <button class="btn-color col-BLEU h-28 rounded-xl font-black text-[10px] sm:text-xs text-white border-2 border-transparent transition-all drop-shadow-md" onclick="selectColor('BLEU', this)">BLEU</button>
                <button class="btn-color col-VERT h-28 rounded-xl font-black text-[10px] sm:text-xs text-white border-2 border-transparent transition-all drop-shadow-md" onclick="selectColor('VERT', this)">VERT</button>
                <button class="btn-color col-JAUNE h-28 rounded-xl font-black text-[10px] sm:text-xs text-white border-2 border-transparent transition-all shadow-[0_1px_2px_rgba(0,0,0,0.8)]" onclick="selectColor('JAUNE', this)">JAUNE</button>
            </div>

            <div class="grid grid-cols-5 gap-2" id="numGrid">
                <script>
                    for(let i=1; i<=10; i++) {
                        document.write(`<button id="btnNum${i}" class="btn-num bg-slate-700 h-12 rounded-xl font-black text-xl border border-slate-600 active:scale-95 transition-all text-slate-300" onclick="selectNum(${i}, this)">${i}</button>`);
                    }
                </script>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-3 text-center">2. Ton Circuit</label>
            
            <div class="grid grid-cols-3 gap-2 mb-6" id="posteGrid">
                <script>
                    for(let i=1; i<=12; i++) {
                        document.write(`<button id="btnPoste${i}" class="btn-poste bg-slate-700 h-14 rounded-xl font-black text-2xl border border-slate-600 active:scale-95 transition-all text-blue-100" onclick="selectPoste(${i}, this)">C${i}</button>`);
                    }
                </script>
            </div>
            
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-center">Code Lettres (1 ou 2)</label>
            <div class="flex justify-center gap-4">
                <input type="text" id="l1" class="input-box" maxlength="1" autocomplete="off" oninput="this.value = this.value.toUpperCase(); if(this.value.length===1) document.getElementById('l2').focus()">
                <input type="text" id="l2" class="input-box" maxlength="1" autocomplete="off" oninput="this.value = this.value.toUpperCase();">
            </div>
        </div>

        <button onclick="validerCode()" class="w-full py-6 bg-blue-600 active:bg-blue-800 text-white font-black text-3xl rounded-xl shadow-lg mt-auto mb-4 tracking-wider">
            ✅ VALIDER
        </button>

    </main>

    <div id="feedback" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center transition-all">
        <div id="fbIcon" class="text-8xl mb-4 drop-shadow-lg"></div>
        <div id="fbPoints" class="text-5xl font-black text-white mb-2 drop-shadow-md"></div>
        <div id="fbMessage" class="text-xl font-bold text-white/80 mb-8"></div>
        <button onclick="fermerFeedback()" class="px-12 py-5 bg-white/20 hover:bg-white/30 border-2 border-white rounded-2xl text-white font-black text-2xl backdrop-blur-sm shadow-xl active:scale-95">
            SUIVANT ➔
        </button>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURATION FIREBASE
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. AUDIO (Bips)
        // ==========================================
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(freq, duration, type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // ==========================================
        // 3. VARIABLES GLOBALES ET ANTI-TRICHE
        // ==========================================
        let curCl = "";
        let selectedColor = "";
        let selectedNum = null;
        let selectedPoste = null; 
        let isCourseActive = false;
        
        // Dictionnaire anti-triche : Mémorise le dernier scan par dossard individuel
        // Structure : { "302_ROUGE_1": 1700000000000 }
        const antiCheatMap = {}; 
        
        let matriceCache = {}; 
        let startListener = null;
        let endListener = null;
        let eleveListener = null; 

        // ==========================================
        // 4. INITIALISATION
        // ==========================================
        window.onload = () => {
            db.ref('settings/classes').on('value', snap => {
                const classes = snap.val() || {};
                const select = document.getElementById('clSelect');
                const currentValue = select.value;
                
                select.innerHTML = '<option value="">-- CHOISIS TA CLASSE --</option>';
                Object.keys(classes).forEach(c => {
                    if(c !== "true" && c !== "null") {
                        select.innerHTML += `<option value="${c}">${c}</option>`;
                    }
                });
                if(currentValue) select.value = currentValue;
            });

            db.ref('settings/matrix').on('value', snap => {
                matriceCache = snap.val() || {};
            });
            
            document.body.addEventListener('click', initAudio, { once: true });
        };

        // ==========================================
        // 5. GESTION DES ÉTATS ET ÉCOUTEURS
        // ==========================================
        function changerClasse() {
            curCl = document.getElementById('clSelect').value;

            if (startListener) startListener.off();
            if (endListener) endListener.off();
            if (eleveListener) eleveListener.off();

            resetSelections();

            if (!curCl) {
                verrouillerUI("En attente de classe...", "text-slate-500");
                return;
            }

            startListener = db.ref(`settings/startTime/${curCl}`);
            endListener = db.ref(`settings/endTime/${curCl}`);

            startListener.on('value', snapStart => {
                const startTime = snapStart.val();
                
                endListener.on('value', snapEnd => {
                    const endTime = snapEnd.val();

                    if (!startTime) {
                        isCourseActive = false;
                        verrouillerUI("Le professeur n'a pas lancé le chrono ⏳", "text-orange-400");
                    } else if (startTime && !endTime) {
                        isCourseActive = true;
                        deverrouillerUI("🟢 COURSE EN COURS", "text-emerald-400");
                    } else if (endTime) {
                        isCourseActive = false;
                        verrouillerUI("🛑 SÉANCE TERMINÉE", "text-red-500");
                    }
                });
            });
        }

        function verrouillerUI(msg, textClass) {
            document.getElementById('mainZone').classList.add('opacity-50', 'pointer-events-none');
            const state = document.getElementById('courseState');
            state.innerText = msg;
            state.className = `text-sm font-black mt-2 uppercase tracking-widest ${textClass}`;
        }

        function deverrouillerUI(msg, textClass) {
            document.getElementById('mainZone').classList.remove('opacity-50', 'pointer-events-none');
            const state = document.getElementById('courseState');
            state.innerText = msg;
            state.className = `text-sm font-black mt-2 uppercase tracking-widest ${textClass}`;
        }

        // ==========================================
        // 6. INTERACTIONS GRILLES
        // ==========================================
        function selectColor(color, btn) {
            selectedColor = color;
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('btn-active'));
            btn.classList.add('btn-active');
            verifierMiseAJourBalises();
        }

        function selectNum(num, btn) {
            selectedNum = num;
            document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('btn-active'));
            btn.classList.add('btn-active');
            verifierMiseAJourBalises();
        }

        function selectPoste(poste, btn) {
            selectedPoste = poste;
            document.querySelectorAll('.btn-poste').forEach(b => b.classList.remove('btn-active'));
            btn.classList.add('btn-active');
            document.getElementById('l1').focus(); 
        }

        // ==========================================
        // 7. AUTO-GRISAGE DES CIRCUITS DÉJÀ FAITS
        // ==========================================
        function verifierMiseAJourBalises() {
            if (curCl && selectedColor && selectedNum) {
                if (eleveListener) eleveListener.off();
                
                eleveListener = db.ref(`sessions/${curCl}/${selectedColor}_${selectedNum}`);
                eleveListener.on('value', snap => {
                    const data = snap.val() || {};
                    
                    for(let i=1; i<=12; i++) {
                        const btn = document.getElementById(`btnPoste${i}`);
                        
                        if (data[`C${i}`]) {
                            btn.classList.add('poste-done');
                            if (selectedPoste === i) {
                                selectedPoste = null;
                                btn.classList.remove('btn-active');
                            }
                        } else {
                            btn.classList.remove('poste-done');
                        }
                    }
                });
            }
        }

        // ==========================================
        // 8. VALIDATION, ANTI-TRICHE ET SAUVEGARDE
        // ==========================================
        function validerCode() {
            if (!isCourseActive) return alert("La course n'est pas active.");
            
            const l1 = document.getElementById('l1').value.toUpperCase();
            const l2 = document.getElementById('l2').value.toUpperCase();

            if (!selectedColor) return alert("Choisis ta COULEUR !");
            if (!selectedNum) return alert("Choisis ton NUMÉRO !");
            if (!selectedPoste) return alert("Choisis ton CIRCUIT !");
            if (!l1 && !l2) return alert("Saisis au moins une lettre du code !");

            // --- VÉRIFICATION ANTI-TRICHE INDIVIDUELLE ---
            const studentKey = `${curCl}_${selectedColor}_${selectedNum}`;
            const lastScanTime = antiCheatMap[studentKey] || 0;
            const timeRemaining = 30 - Math.floor((Date.now() - lastScanTime) / 1000);

            if (timeRemaining > 0) {
                return alert(`⏳ Anti-triche : Déplacement impossible en si peu de temps. Attends encore ${timeRemaining} secondes pour valider ton prochain circuit !`);
            }

            // --- VÉRIFICATION MATRICE ---
            const codeVerite = matriceCache[selectedPoste]?.[selectedColor];
            let pts = 0;
            let msg = "Faux !";
            let succes = false;

            if (codeVerite) {
                if (l1 === codeVerite[0] && l1 !== "") pts += 2.5;
                if (l2 === codeVerite[1] && l2 !== "") pts += 2.5;
                
                pts = Math.floor(pts === 5 ? 5 : (pts > 0 ? 2 : 0));
                
                if (pts === 5) { msg = "Code Parfait !"; succes = true; playTone(880, 0.3, 'sine'); }
                else if (pts === 2) { msg = "1 lettre correcte !"; succes = true; playTone(440, 0.2, 'sine'); }
                else { playTone(150, 0.4, 'sawtooth'); }
            } else {
                playTone(150, 0.4, 'sawtooth');
            }

            // --- ENREGISTREMENT LOCAL (Blocage de 30s) ---
            antiCheatMap[studentKey] = Date.now();

            // --- ENVOI FIREBASE ---
            db.ref(`sessions/${curCl}/${selectedColor}_${selectedNum}/C${selectedPoste}`).set({ 
                score: pts, 
                realTime: firebase.database.ServerValue.TIMESTAMP 
            }).then(() => {
                afficherFeedback(succes, pts, l1+l2, msg);
            }).catch(err => alert("Erreur réseau : " + err));
        }

        // ==========================================
        // 9. FEEDBACK ET NETTOYAGE
        // ==========================================
        function afficherFeedback(succes, pts, codeSaisi, msgTexte) {
            const fb = document.getElementById('feedback');
            const icon = document.getElementById('fbIcon');
            const points = document.getElementById('fbPoints');
            const msg = document.getElementById('fbMessage');

            if (pts === 5) {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-emerald-600 transition-all";
                icon.innerText = "🏆";
            } else if (pts === 2) {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-orange-500 transition-all";
                icon.innerText = "🆗";
            } else {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-red-600 transition-all";
                icon.innerText = "❌";
            }
            
            points.innerText = `+${pts} PTS`;
            msg.innerText = msgTexte;
            fb.classList.remove('hidden');
        }

        function fermerFeedback() {
            document.getElementById('feedback').classList.add('hidden');
            resetSelections();
            document.getElementById('mainZone').scrollTop = 0;
        }

        function resetSelections() {
            document.getElementById('l1').value = "";
            document.getElementById('l2').value = "";
            selectedColor = "";
            selectedNum = null;
            selectedPoste = null;
            
            document.querySelectorAll('.btn-color, .btn-num, .btn-poste').forEach(b => {
                b.classList.remove('btn-active');
                if(b.classList.contains('btn-poste')) b.classList.remove('poste-done');
            });

            if (eleveListener) {
                eleveListener.off();
                eleveListener = null;
            }
        }
    </script>
</body>
</html>
