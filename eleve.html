<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saisie Élève | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; color: white; user-select: none; }
        .input-box { background: #1e293b; border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; border-radius: 15px; width: 80px; height: 80px; text-transform: uppercase; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        .btn-active { background: #3b82f6 !important; border-color: white !important; transform: scale(1.05); }
        .btn-color { transition: 0.2s; }
        
        .col-NOIR { background-color: #334155; }
        .col-ROUGE { background-color: #b91c1c; }
        .col-BLEU { background-color: #1d4ed8; }
        .col-VERT { background-color: #15803d; }
        .col-JAUNE { background-color: #a16207; }
    </style>
</head>
<body class="flex flex-col h-screen font-sans">

    <header id="headerStatus" class="bg-slate-800 p-4 text-center border-b-4 border-slate-700 shadow-md">
        <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter uppercase">Orient'Show</h1>
        <div id="courseState" class="text-sm font-bold text-slate-400 mt-1">Connexion en cours...</div>
    </header>

    <main id="mainZone" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 opacity-50 pointer-events-none transition-opacity duration-300">
        
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">1. Ta Classe</label>
            <select id="clSelect" class="w-full bg-slate-900 border border-slate-600 text-white font-bold p-3 rounded-lg outline-none focus:border-blue-500" onchange="changerClasse()">
                <option value="">Sélectionne ta classe...</option>
            </select>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">2. Ton Dossard</label>
            <div class="grid grid-cols-5 gap-2 mb-4" id="colorGrid">
                <button class="btn-color col-NOIR h-12 rounded-lg font-bold border-2 border-transparent" onclick="selectColor('NOIR', this)"></button>
                <button class="btn-color col-ROUGE h-12 rounded-lg font-bold border-2 border-transparent" onclick="selectColor('ROUGE', this)"></button>
                <button class="btn-color col-BLEU h-12 rounded-lg font-bold border-2 border-transparent" onclick="selectColor('BLEU', this)"></button>
                <button class="btn-color col-VERT h-12 rounded-lg font-bold border-2 border-transparent" onclick="selectColor('VERT', this)"></button>
                <button class="btn-color col-JAUNE h-12 rounded-lg font-bold border-2 border-transparent" onclick="selectColor('JAUNE', this)"></button>
            </div>
            <div class="flex items-center gap-4">
                <span class="font-bold text-slate-400">N°</span>
                <input type="number" id="numEleve" class="flex-1 bg-slate-900 border border-slate-600 p-3 rounded-lg text-xl font-black text-center outline-none focus:border-blue-500" placeholder="Ex: 1">
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">3. La Balise</label>
            <div class="flex items-center gap-4 mb-4">
                <span class="font-bold text-slate-400">Poste N°</span>
                <input type="number" id="numPoste" class="flex-1 bg-slate-900 border border-slate-600 p-3 rounded-lg text-xl font-black text-center outline-none focus:border-blue-500" placeholder="Ex: 5">
            </div>
            
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-center">Code Lettres</label>
            <div class="flex justify-center gap-4">
                <input type="text" id="l1" class="input-box" maxlength="1" autocomplete="off" oninput="if(this.value.length===1) document.getElementById('l2').focus()">
                <input type="text" id="l2" class="input-box" maxlength="1" autocomplete="off">
            </div>
        </div>

        <button onclick="validerCode()" class="w-full py-5 bg-blue-600 active:bg-blue-800 text-white font-black text-2xl rounded-xl shadow-lg mt-auto mb-4">
            ✅ VALIDER
        </button>

    </main>

    <div id="feedback" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center transition-all">
        <div id="fbIcon" class="text-8xl mb-4 drop-shadow-lg"></div>
        <div id="fbPoints" class="text-5xl font-black text-white mb-2 drop-shadow-md"></div>
        <div id="fbMessage" class="text-xl font-bold text-white/80 mb-8"></div>
        <button onclick="fermerFeedback()" class="px-10 py-4 bg-white/20 hover:bg-white/30 border border-white rounded-xl text-white font-bold text-xl backdrop-blur-sm">
            SUIVANT ➔
        </button>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURATION FIREBASE
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. AUDIO (Bips)
        // ==========================================
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(freq, duration, type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // ==========================================
        // 3. VARIABLES GLOBALES
        // ==========================================
        let curCl = "";
        let selectedColor = "";
        let isCourseActive = false;
        let matriceCache = {}; 
        let startListener = null;
        let endListener = null;

        // ==========================================
        // 4. INITIALISATION
        // ==========================================
        window.onload = () => {
            // Remplir le menu (en ignorant les bugs potentiels comme "true")
            db.ref('settings/classes').on('value', snap => {
                const classes = snap.val() || {};
                const select = document.getElementById('clSelect');
                select.innerHTML = '<option value="">Sélectionne ta classe...</option>';
                Object.keys(classes).forEach(c => {
                    if(c !== "true" && c !== "null") select.innerHTML += `<option value="${c}">${c}</option>`;
                });
            });

            // Cache de la matrice pour validation sans latence
            db.ref('settings/matrix').on('value', snap => {
                matriceCache = snap.val() || {};
            });
            
            // Activation audio sur le premier clic (Sécurité navigateurs)
            document.body.addEventListener('click', initAudio, { once: true });
        };

        // ==========================================
        // 5. CHANGEMENT DE CLASSE & VERROUILLAGE
        // ==========================================
        function changerClasse() {
            curCl = document.getElementById('clSelect').value;

            if (startListener) startListener.off();
            if (endListener) endListener.off();

            if (!curCl) {
                verrouillerUI("Sélectionne une classe", "border-slate-700", "text-slate-400");
                return;
            }

            startListener = db.ref(`settings/startTime/${curCl}`);
            endListener = db.ref(`settings/endTime/${curCl}`);

            startListener.on('value', snapStart => {
                const startTime = snapStart.val();
                
                endListener.on('value', snapEnd => {
                    const endTime = snapEnd.val();

                    if (!startTime) {
                        isCourseActive = false;
                        verrouillerUI("En attente du départ...", "border-slate-700", "text-slate-400");
                    } else if (startTime && !endTime) {
                        isCourseActive = true;
                        deverrouillerUI("Course en cours 🏃‍♂️", "border-emerald-600", "text-emerald-400");
                    } else if (endTime) {
                        isCourseActive = false;
                        verrouillerUI("Course terminée 🛑", "border-red-600", "text-red-400");
                    }
                });
            });
        }

        function verrouillerUI(msg, borderClass, textClass) {
            document.getElementById('mainZone').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('courseState').innerText = msg;
            document.getElementById('headerStatus').className = `bg-slate-800 p-4 text-center border-b-4 ${borderClass} shadow-md`;
            document.getElementById('courseState').className = `text-sm font-bold mt-1 ${textClass}`;
        }

        function deverrouillerUI(msg, borderClass, textClass) {
            document.getElementById('mainZone').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('courseState').innerText = msg;
            document.getElementById('headerStatus').className = `bg-slate-800 p-4 text-center border-b-4 ${borderClass} shadow-md`;
            document.getElementById('courseState').className = `text-sm font-bold mt-1 ${textClass}`;
        }

        function selectColor(color, btn) {
            selectedColor = color;
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('btn-active'));
            btn.classList.add('btn-active');
        }

        // ==========================================
        // 6. VALIDATION & SAUVEGARDE (Aligné avec Maître)
        // ==========================================
        function validerCode() {
            if (!isCourseActive) return alert("La course n'est pas active.");
            
            const num = document.getElementById('numEleve').value;
            const poste = parseInt(document.getElementById('numPoste').value);
            const l1 = document.getElementById('l1').value.toUpperCase();
            const l2 = document.getElementById('l2').value.toUpperCase();

            if (!selectedColor || !num || !poste || (!l1 && !l2)) {
                return alert("Remplis tous les champs (au moins une lettre) !");
            }

            const codeVerite = matriceCache[poste]?.[selectedColor];
            let pts = 0;
            let msg = "Faux !";
            let succes = false;

            if (codeVerite) {
                // Correspondance avec le barème attendu par ton fichier Maitre
                if (l1 === codeVerite[0]) pts += 2.5;
                if (l2 === codeVerite[1]) pts += 2.5;
                
                pts = Math.floor(pts === 5 ? 5 : (pts > 0 ? 2 : 0)); // 5pts = parfait, 2pts = partiel, 0pt = faux
                
                if (pts === 5) { msg = "Parfait !"; succes = true; playTone(880, 0.3, 'sine'); }
                else if (pts === 2) { msg = "1 lettre correcte !"; succes = true; playTone(440, 0.2, 'sine'); }
                else { playTone(150, 0.4, 'sawtooth'); }
            } else {
                playTone(150, 0.4, 'sawtooth');
            }

            // Écriture de la balise précise au bon endroit pour les stats de Maitre
            db.ref(`sessions/${curCl}/${selectedColor}_${num}/C${poste}`).set({ 
                score: pts, 
                realTime: firebase.database.ServerValue.TIMESTAMP 
            }).then(() => {
                afficherFeedback(succes, pts, l1+l2, msg);
            }).catch(err => alert("Erreur réseau : " + err));
        }

        // ==========================================
        // 7. FEEDBACK ET NETTOYAGE (Stateless)
        // ==========================================
        function afficherFeedback(succes, pts, codeSaisi, msgTexte) {
            const fb = document.getElementById('feedback');
            const icon = document.getElementById('fbIcon');
            const points = document.getElementById('fbPoints');
            const msg = document.getElementById('fbMessage');

            if (pts === 5) {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-emerald-600 transition-all";
                icon.innerText = "🏆";
            } else if (pts === 2) {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-orange-500 transition-all";
                icon.innerText = "🆗";
            } else {
                fb.className = "fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center bg-red-600 transition-all";
                icon.innerText = "❌";
            }
            
            points.innerText = `+${pts} PTS`;
            msg.innerText = msgTexte;
            fb.classList.remove('hidden');
        }

        function fermerFeedback() {
            document.getElementById('feedback').classList.add('hidden');
            
            document.getElementById('numEleve').value = "";
            document.getElementById('numPoste').value = "";
            document.getElementById('l1').value = "";
            document.getElementById('l2').value = "";
            selectedColor = "";
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('btn-active'));
            
            document.getElementById('mainZone').scrollTop = 0;
        }
    </script>
</body>
</html>
