<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orient'Show | Élève</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; }
        .input-box { background: #1e293b; border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; border-radius: 15px; width: 85px; height: 85px; text-transform: uppercase; outline: none; }
        .btn-num { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px; font-weight: 900; transition: 0.2s; }
        .btn-active { background: #3b82f6 !important; border-color: #fff !important; transform: scale(1.05); }
        .done { background: #064e3b !important; border-color: #059669 !important; color: #34d399; opacity: 0.6; }
        .valid { color: #22c55e; } .strike { text-decoration: line-through; color: #ef4444; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body class="text-white font-sans p-4 select-none">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        
        <h1 onclick="secretTV()" class="text-4xl font-black text-blue-500 italic text-center uppercase tracking-tighter py-4 active:scale-95 transition-transform">
            Orient'Show
        </h1>

        <!-- ÉCRAN D'ATTENTE (CHRONO NON LANCÉ) -->
        <div id="waitingScreen" class="hidden flex-1 flex flex-col items-center justify-center text-center space-y-6">
            <div class="text-8xl animate-bounce">⏳</div>
            <h2 class="text-2xl font-black uppercase italic">En attente du départ...</h2>
            <p class="text-slate-400">Le professeur n'a pas encore lancé la session.</p>
        </div>

        <!-- ÉTAPE 1 : CHOIX IDENTITÉ -->
        <div id="step1" class="space-y-4">
            <select id="selectClasse" class="w-full p-4 bg-slate-800 rounded-xl font-bold border border-slate-700 text-white text-lg outline-none focus:border-blue-500"></select>
            
            <div class="grid grid-cols-5 gap-2" id="gridNums">
                <script>for(let i=1;i<=10;i++) document.write(`<button onclick="setNum(${i})" id="btnN${i}" class="btn-num">${i}</button>`)</script>
            </div>

            <div class="grid grid-cols-2 gap-2 font-black italic">
                <button onclick="setColor('NOIR')" class="p-5 bg-black rounded-2xl border border-slate-600 active:scale-95 transition-transform">NOIR</button>
                <button onclick="setColor('ROUGE')" class="p-5 bg-red-600 rounded-2xl border border-red-400 active:scale-95 transition-transform">ROUGE</button>
                <button onclick="setColor('BLEU')" class="p-5 bg-blue-600 rounded-2xl border border-blue-400 active:scale-95 transition-transform">BLEU</button>
                <button onclick="setColor('VERT')" class="p-5 bg-green-600 rounded-2xl border border-green-400 active:scale-95 transition-transform">VERT</button>
                <button onclick="setColor('JAUNE')" class="p-5 bg-yellow-500 text-black rounded-2xl col-span-2 active:scale-95 transition-transform">JAUNE</button>
            </div>
        </div>

        <!-- ÉTAPE 2 : SAISIE CIRCUIT -->
        <div id="step2" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
                <span id="identite" class="font-black text-blue-400 uppercase tracking-wide"></span>
                <button onclick="location.reload()" class="text-xs bg-slate-700 px-3 py-1 rounded-lg font-bold">RETOUR</button>
            </div>

            <!-- VISUALISATION DES CIRCUITS (PASTILLES) -->
            <div class="grid grid-cols-4 gap-2" id="parcoursSelection">
                <script>for(let i=1;i<=12;i++) document.write(`<button onclick="setParcours(${i})" id="pBtn${i}" class="p-3 bg-slate-900 rounded-lg font-black border border-slate-700 transition-all">P${i}</button>`)</script>
            </div>

            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-6">
                <div class="flex justify-center gap-4">
                    <input type="text" id="l1" class="input-box" maxlength="1" autocomplete="off" spellcheck="false">
                    <input type="text" id="l2" class="input-box" maxlength="1" autocomplete="off" spellcheck="false">
                </div>
                <button onclick="valider()" class="w-full bg-blue-600 p-6 rounded-2xl text-3xl font-black uppercase shadow-xl active:scale-95 transition-all">Valider</button>
            </div>
        </div>

        <!-- FEEDBACK -->
        <div id="feedback" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center transition-colors duration-500">
            <div id="fbIcon" class="text-9xl mb-4"></div>
            <div id="fbPoints" class="text-7xl font-black mb-2 italic"></div>
            <div class="flex gap-4 mb-6 text-5xl font-black" id="fbCorrection"><span id="resL1"></span><span id="resL2"></span></div>
            <div id="fbMsg" class="text-2xl font-bold mb-8 leading-tight"></div>
            <button onclick="location.reload()" class="bg-white text-black px-12 py-5 rounded-full font-black uppercase text-xl shadow-2xl">Continuer</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        
        let currentNum, currentColor, currentParcours, CORRECTION = {}, classResults = {}, clickCount = 0, clickTimer;
        let sessionStartTime = null;

        function secretTV() { clickCount++; clearTimeout(clickTimer); clickTimer = setTimeout(() => { clickCount = 0; }, 500); if (clickCount === 3) window.location.href = "tv.html"; }

        // CHARGEMENT CLASSES
        db.ref('settings/classes').on('value', snap => {
            const sel = document.getElementById('selectClasse'); sel.innerHTML = '<option value="">-- CHOISIR CLASSE --</option>';
            const data = snap.val() || {};
            Object.keys(data).forEach(c => { if(c && c !== "null") sel.innerHTML += `<option value="${c}">${c}</option>`; });
        });

        // CHARGEMENT MATRICE
        db.ref('settings/matrix').on('value', snap => { CORRECTION = snap.val() || {}; });

        function setNum(n) { currentNum = n; document.querySelectorAll('#gridNums button').forEach(b => b.classList.remove('btn-active')); document.getElementById('btnN'+n).classList.add('btn-active'); }
        
        function setColor(c) {
            const cl = document.getElementById('selectClasse').value; 
            if(!currentNum || !cl) return alert("Choisis ta CLASSE et ton DOSSARD !");
            
            // VERIFICATION DU TOP DÉPART
            db.ref(`settings/startTime/${cl}`).once('value', snap => {
                sessionStartTime = snap.val();
                if(!sessionStartTime) {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('waitingScreen').classList.remove('hidden');
                    // On check en temps réel si le prof lance
                    db.ref(`settings/startTime/${cl}`).on('value', s => { if(s.val()) location.reload(); });
                    return;
                }
                
                currentColor = c;
                document.getElementById('identite').innerText = `${cl} | ${currentColor} ${currentNum}`;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                
                // Charger les circuits déjà faits
                db.ref(`sessions/${cl}/${currentColor}_${currentNum}`).on('value', snap => {
                    classResults = snap.val() || {};
                    Object.keys(classResults).forEach(pKey => { 
                        const btn = document.getElementById('pBtn'+pKey.replace('C',''));
                        if(btn) btn.classList.add('done');
                    });
                });
            });
        }

        function setParcours(p) { 
            currentParcours = p; 
            document.querySelectorAll('#parcoursSelection button').forEach(b => b.classList.remove('btn-active')); 
            document.getElementById('pBtn'+p).classList.add('btn-active'); 
        }

        function valider() {
            const cl = document.getElementById('selectClasse').value;
            const uKey = `${currentColor}_${currentNum}`;
            const l1 = document.getElementById('l1').value.toUpperCase().trim();
            const l2 = document.getElementById('l2').value.toUpperCase().trim();
            
            if(!currentParcours) return alert("Choisis un CIRCUIT (P1 à P12) !");
            if(classResults[`C${currentParcours}`]) return alert("Circuit déjà validé !");

            const sol = CORRECTION[currentParcours]?.[currentColor];
            let pts = 0; let msg = "Tout est faux... 🛑"; let s1="strike", s2="strike";

            if(sol) {
                if((l1===sol[0] && l2===sol[1]) || (l1===sol[1] && l2===sol[0])) { 
                    pts = 5; s1="valid"; s2="valid"; msg = "Parfait ! Monte d'un cran ! 🏔️"; 
                }
                else if(l1===sol[0] || l1===sol[1] || l2===sol[0] || l2===sol[1]) { 
                    pts = 2; msg = "Presque ! Une erreur de lettre. 🧐"; 
                    if(l1===sol[0] || l1===sol[1]) s1="valid"; 
                    if(l2===sol[0] || l2===sol[1]) s2="valid"; 
                }
            }

            const timeTotal = Math.floor((Date.now() - sessionStartTime) / 1000);

            db.ref(`sessions/${cl}/${uKey}/C${currentParcours}`).set({
                score: pts,
                time: timeTotal,
                timestamp: Date.now()
            }).then(() => {
                const fb = document.getElementById('feedback');
                fb.className = `fixed inset-0 flex flex-col items-center justify-center z-50 p-8 text-center ${pts===5?'bg-green-600':pts===2?'bg-orange-500':'bg-red-600 animate-shake'}`;
                document.getElementById('fbIcon').innerText = pts===5?"🏆":pts===2?"🆗":"❌";
                document.getElementById('fbPoints').innerText = `+${pts} PTS`;
                document.getElementById('fbMsg').innerText = msg;
                document.getElementById('resL1').innerText = l1 || "?"; document.getElementById('resL1').className = s1;
                document.getElementById('resL2').innerText = l2 || "?"; document.getElementById('resL2').className = s2;
                document.getElementById('step2').classList.add('hidden');
                fb.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
