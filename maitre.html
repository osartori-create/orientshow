<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master PRO | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .tab-btn { flex: 1; padding: 20px; font-weight: 900; text-transform: uppercase; background: #1e293b; border-bottom: 5px solid transparent; transition: 0.3s; }
        .tab-active { background: #3b82f6; border-color: white; }
        .pastille { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #000; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="p-4">
    <header class="flex flex-col lg:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4 italic font-black uppercase text-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl text-blue-500 tracking-tighter">Master PRO</h1>
            <button id="btnChrono" onclick="toggleChrono()" class="bg-emerald-600 px-6 py-2 rounded-full shadow-[0_0_15px_rgba(5,150,105,0.6)]">🚀 TOP DÉPART</button>
            <div id="chronoDisplay" class="hidden text-2xl font-mono text-yellow-400">00:00</div>
        </div>
        <div class="flex items-center gap-2">
            <select id="activeClasse" onchange="loadClasse()" class="bg-slate-800 p-2 rounded-lg border border-slate-700"></select>
            <button onclick="exportExcel()" class="bg-green-600 px-4 py-2 rounded-lg text-[10px] font-black uppercase">⬇️ Export Ratio</button>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('csv').click()" class="bg-blue-600 px-4 py-2 rounded-lg text-[10px]">📂 Import iDoceo</button>
            <input type="file" id="csv" class="hidden" accept=".csv" onchange="importCSV(this)">
            <button onclick="resetData('base')" class="bg-red-600 px-3 py-2 rounded-lg text-[10px]">Purger</button>
        </div>
    </header>

    <nav class="flex gap-2 mb-6">
        <button onclick="switchTab('bilan')" id="btnTabBilan" class="tab-btn tab-active">📊 Bilan</button>
        <button onclick="switchTab('carte')" id="btnTabCarte" class="tab-btn">🏆 Podium</button>
        <button onclick="switchTab('groupes')" id="btnTabGroupes" class="tab-btn">👥 Groupes</button>
        <button onclick="switchTab('stats')" id="btnTabStats" class="tab-btn">📈 Stats</button>
        <button onclick="switchTab('codes')" id="btnTabCodes" class="tab-btn !flex-none !w-24 text-[10px]">📝 Codes</button>
    </nav>

    <div id="viewBilan" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="viewGroupes" class="hidden grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="viewCarte" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <div id="podiumContainer" class="flex justify-center items-end gap-4 h-56 mb-10 border-b border-slate-700 pb-4"></div>
        <div id="leaderboardList" class="space-y-2 max-w-2xl mx-auto max-h-[40vh] overflow-y-auto pr-2"></div>
    </div>
    <div id="viewStats" class="hidden space-y-6">
        <div class="grid grid-cols-4 gap-4" id="statsResume"></div>
        <div class="overflow-auto rounded-2xl border border-slate-700"><table class="w-full text-left font-bold text-sm"><thead class="bg-slate-900"><tr><th class="p-4">Circuit</th><th>Tentatives</th><th>Parfait</th><th>Partiel</th><th>Echec</th></tr></thead><tbody id="statsBody"></tbody></table></div>
    </div>
    <div id="viewCodes" class="hidden overflow-x-auto bg-slate-800 p-4 border border-slate-700 rounded-xl"><table class="w-full text-center font-bold" id="matrixTable"></table></div>

    <div id="modalDetails" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-2xl rounded-3xl p-6 border border-slate-700">
            <div class="flex justify-between items-start mb-4 text-blue-400 font-black italic text-xl"><h2 id="mName"></h2><button onclick="document.getElementById('modalDetails').classList.add('hidden')" class="text-4xl">&times;</button></div>
            <div class="bg-slate-900 rounded-xl p-4 mb-4 h-64"><canvas id="detailChart"></canvas></div>
            <div id="mHistory" class="space-y-2 max-h-[30vh] overflow-auto"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const colors = ["NOIR", "ROUGE", "BLEU", "VERT", "JAUNE"];
        let mapping = JSON.parse(localStorage.getItem('os_map_final') || '{}'), curCl = localStorage.getItem('os_last_cl') || "", results = {};
        let startT = 0, stopT = 0, detailChart = null;

        window.onload = () => {
            db.ref('settings/classes').on('value', snap => {
                const clArr = Object.keys(snap.val()||{}).filter(c => c!=="true" && c!=="null");
                document.getElementById('activeClasse').innerHTML = clArr.map(c => `<option value="${c}" ${c===curCl?'selected':''}>${c}</option>`).join('');
                if(curCl) loadClasse();
            });
        };

        function loadClasse() {
            curCl = document.getElementById('activeClasse').value;
            localStorage.setItem('os_last_cl', curCl);
            db.ref(`sessions/${curCl}`).on('value', snap => { results = snap.val() || {}; updateUI(); });
            db.ref(`settings/startTime/${curCl}`).on('value', s => { 
                startT = s.val(); 
                db.ref(`settings/endTime/${curCl}`).on('value', e => { 
                    stopT = e.val(); 
                    updateChronoUI(); 
                });
            });
        }

        function toggleChrono() {
            if(!curCl) return;
            if(!startT) db.ref(`settings/startTime/${curCl}`).set(Date.now());
            else if(!stopT) { if(confirm("Stop course ?")) db.ref(`settings/endTime/${curCl}`).set(Date.now()); }
        }

        function updateChronoUI() {
            const btn = document.getElementById('btnChrono');
            const disp = document.getElementById('chronoDisplay');
            if(!startT) { btn.innerText = "🚀 TOP DÉPART"; btn.className = "bg-emerald-600 px-6 py-2 rounded-full"; disp.classList.add('hidden'); }
            else if(!stopT) { 
                btn.innerText = "🛑 STOP SÉANCE"; btn.className = "bg-red-600 px-6 py-2 rounded-full"; disp.classList.remove('hidden');
                clearInterval(window.it); window.it = setInterval(() => { const s = Math.floor((Date.now()-startT)/1000); disp.innerText = new Date(s*1000).toISOString().substr(14,5); }, 1000);
            } else { btn.innerText = "⏱️ TERMINÉ"; btn.className = "bg-slate-600 px-6 py-2 rounded-full"; clearInterval(window.it); }
        }

        function updateUI() {
            const bil = document.getElementById('viewBilan'); const grp = document.getElementById('viewGroupes');
            bil.innerHTML = ""; grp.innerHTML = "";
            const list = mapping[curCl] || [];
            list.forEach(s => {
                const sessionData = results[s.code] || {};
                const pts = Object.keys(sessionData).reduce((a,k) => a + (k.startsWith('C')?sessionData[k].score:0), 0);
                const bg = pts > 0 ? "bg-blue-600" : "bg-slate-800";
                bil.innerHTML += `<div onclick="openModal('${s.first} ${s.last}','${s.code}')" class="${bg} p-4 rounded-xl text-center cursor-pointer"><div class="text-2xl font-black">${pts}</div><p class="font-bold truncate">${s.first}</p></div>`;
                grp.innerHTML += `<div class="bg-slate-800 p-4 rounded-xl border ${s.absent?'opacity-30 border-dashed':''}"><select onchange="changeCode('${s.id}', this.value)" class="bg-slate-900 w-full text-xs font-bold"><option value="ABS" ${s.absent?'selected':''}>ABSENT</option>${colors.flatMap(c => [...Array(10).keys()].map(n => `<option value="${c}_${n+1}" ${s.code==`${c}_${n+1}`?'selected':''}>${c} ${n+1}</option>`)).join('')}</select><p class="mt-2 text-[10px] truncate">${s.first} ${s.last}</p></div>`;
            });
            updatePodium();
        }

        function openModal(name, code) {
            document.getElementById('mName').innerText = name;
            document.getElementById('modalDetails').classList.remove('hidden');
            const data = results[code] || {};
            const history = Object.keys(data).filter(k => k.startsWith('C')).map(k => ({ p: k, ...data[k] })).sort((a,b) => a.realTime - b.realTime);
            
            document.getElementById('mHistory').innerHTML = history.map(h => `<div class="bg-slate-900 p-3 rounded flex justify-between font-bold"><span>${h.p} : ${h.score} pts</span><span class="text-slate-500">${new Date(h.realTime).toLocaleTimeString()}</span></div>`).join('');
            
            if(detailChart) detailChart.destroy();
            const ctx = document.getElementById('detailChart').getContext('2d');
            detailChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => Math.floor((h.realTime - startT)/60000) + 'm'),
                    datasets: [{ data: history.map(h => h.score), borderColor: 'white', backgroundColor: 'rgba(255,255,255,0.1)', fill: true, pointRadius: 8, tension: 0.1 }]
                },
                options: {
                    scales: { y: { min: 0, max: 5, grid: { color: 'rgba(255,255,255,0.1)' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function exportExcel() {
            const list = mapping[curCl] || [];
            const duration = ((stopT || Date.now()) - startT) / 60000;
            let maxPts = 0;
            const data = list.map(s => {
                const sess = results[s.code] || {};
                const pts = Object.keys(sess).reduce((a,k) => a + (k.startsWith('C')?sess[k].score:0), 0);
                if(pts > maxPts) maxPts = pts;
                return { s, pts, ratio: pts/duration };
            });

            const wb = XLSX.utils.book_new();
            const notes = [["@lastname", "@name", "Dossard", "Score", "Ratio", "Note /20"]];
            data.forEach(d => {
                const note = maxPts > 0 ? (d.pts / maxPts * 20).toFixed(1) : 0;
                notes.push([d.s.last, d.s.first, d.s.code, d.pts, d.ratio.toFixed(2), note]);
            });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(notes), "Notes");
            XLSX.writeFile(wb, `OrientShow_${curCl}.xlsx`);
        }

        function changeCode(id, val) { const s = (mapping[curCl]||[]).find(x => x.id == id); s.absent = (val === "ABS"); if(!s.absent) s.code = val; localStorage.setItem('os_map_final', JSON.stringify(mapping)); updateUI(); }
        function switchTab(t) { ['viewBilan','viewGroupes','viewCarte','viewStats','viewCodes'].forEach(v => document.getElementById(v).classList.add('hidden')); document.getElementById('view'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden'); }
        function resetData() { if(confirm("Vider tout ?")) { db.ref().remove(); localStorage.clear(); location.reload(); } }
        
        function importCSV(input) {
            Papa.parse(input.files[0], { header: true, complete: res => {
                const data = res.data.filter(r => r['@lastname']);
                const cName = (data[0]['@classe'] || prompt("Classe ?")).toUpperCase();
                mapping[cName] = data.map((r, i) => ({ id: Date.now()+i, last: r['@lastname'], first: r['@name'], code: `${["NOIR","ROUGE","BLEU","VERT","JAUNE"][i % 5]}_${Math.floor(i / 5) + 1}`, absent: false }));
                localStorage.setItem('os_map_final', JSON.stringify(mapping));
                db.ref(`settings/classes/${cName}`).set(true).then(() => location.reload());
            }});
        }

        db.ref('settings/matrix').on('value', snap => {
            let m = snap.val() || {}, h = `<tr class="bg-slate-900 text-xs text-white"><th>#</th><th colspan="2" class="bg-black">NOIR</th><th colspan="2" class="bg-red-600">ROUGE</th><th colspan="2" class="bg-blue-600">BLEU</th><th colspan="2" class="bg-green-600">VERT</th><th colspan="2" class="bg-yellow-500 text-black">JAUNE</th></tr>`;
            for(let c=1; c<=12; c++) { h += `<tr class="border-b border-slate-700"><td>C${c}</td>`; ["NOIR","ROUGE","BLEU","VERT","JAUNE"].forEach(col => { const l = m[c]?.[col] || ["",""]; h += `<td><input class="w-10 bg-slate-900 text-center font-black text-xl text-blue-400 m-1 uppercase" value="${l[0]}" onchange="db.ref('settings/matrix/${c}/${col}/0').set(this.value.toUpperCase())"></td><td><input class="w-10 bg-slate-900 text-center font-black text-xl text-blue-400 m-1 uppercase" value="${l[1]}" onchange="db.ref('settings/matrix/${c}/${col}/1').set(this.value.toUpperCase())"></td>`; }); h += `</tr>`; }
            document.getElementById('matrixTable').innerHTML = h;
        });
    </script>
</body>
</html>
