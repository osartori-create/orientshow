<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master PRO | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <script>
        // Sécurité basique
        if (sessionStorage.getItem("os_access") !== "granted") window.location.href = "index.html";
    </script>
    
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn { transition: 0.3s; }
        .tab-btn.active { background-color: #1e293b; border-bottom: 4px solid #3b82f6; color: #60a5fa; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4">
        <h1 class="text-2xl font-black italic text-blue-500 uppercase tracking-tighter">Orient'Show <span class="text-white text-sm">PRO</span></h1>
        <div class="flex items-center gap-4 mt-4">
            <span class="font-bold text-slate-400">Classe active :</span>
            <span id="displayCurCl" class="px-3 py-1 bg-blue-900/50 text-blue-400 font-bold rounded border border-blue-800">Aucune</span>
        </div>
    </header>

    <nav class="flex bg-slate-800 text-slate-400 font-bold uppercase text-sm">
        <button class="tab-btn active flex-1 p-4" onclick="openTab('tab-config', this)">⚙️ Config</button>
        <button class="tab-btn flex-1 p-4" onclick="openTab('tab-csv', this)">📄 Import CSV</button>
        <button class="tab-btn flex-1 p-4" onclick="openTab('tab-chrono', this)">⏱️ Chrono</button>
        <button class="tab-btn flex-1 p-4" onclick="openTab('tab-carte', this)">🗺️ Podium (Carte)</button>
    </nav>

    <main class="flex-1 overflow-auto p-6">

        <div id="tab-config" class="tab-content active space-y-6">
            <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-xl font-black">Administration Base de données</h2>
                <div class="space-x-2">
                    <button onclick="resetData('scores')" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded transition">Vider les scores</button>
                    <button onclick="resetData('all')" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded transition">PURGE TOTALE</button>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 overflow-x-auto">
                <h2 class="text-xl font-black mb-4">Matrice des Codes (En dur)</h2>
                <table class="w-full text-center border-collapse">
                    <thead id="matrixHead"></thead>
                    <tbody id="matrixBody"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-csv" class="tab-content">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center max-w-2xl mx-auto mt-10">
                <h2 class="text-2xl font-black mb-2">Importer une classe (iDoceo)</h2>
                <p class="text-sm text-slate-400 mb-6">Traitement local RGPD : Seuls les identifiants partent sur le cloud.</p>
                <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition inline-block">
                    📂 Sélectionner le fichier CSV
                    <input type="file" accept=".csv" class="hidden" onchange="handleFile(event)">
                </label>
            </div>
        </div>

        <div id="tab-chrono" class="tab-content">
            <div class="bg-slate-800 p-10 rounded-xl border border-slate-700 text-center max-w-xl mx-auto mt-10">
                <h2 class="text-3xl font-black mb-8">Gestion de la course</h2>
                <button id="btnChrono" onclick="toggleChrono()" class="w-full py-6 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-2xl rounded-xl shadow-[0_0_20px_rgba(5,150,105,0.4)] transition">
                    ⏱️ DÉMARRER LA SÉANCE
                </button>
                <p id="chronoStatus" class="mt-4 text-slate-400 font-mono">En attente...</p>
            </div>
        </div>

        <div id="tab-carte" class="tab-content">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 min-h-[500px]">
                <h3 class="text-2xl font-black text-blue-400 mb-8 uppercase text-center">🏆 Classement en direct</h3>
                
                <div id="podiumContainer" class="flex justify-center items-end gap-4 h-56 mb-10 border-b border-slate-700 pb-4">
                    </div>

                <div id="leaderboardList" class="space-y-2 max-w-2xl mx-auto">
                    </div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. CONFIGURATION FIREBASE (À remplir avec tes clés)
        // ==========================================
        const firebaseConfig = {
            apiKey: "TA_CLE_API",
            authDomain: "TON_DOMAINE.firebaseapp.com",
            databaseURL: "TA_DATABASE_URL",
            projectId: "TON_PROJET",
            storageBucket: "TON_BUCKET",
            messagingSenderId: "TON_ID",
            appId: "TON_APP_ID"
        };
        // Initialisation sécurisée pour éviter les erreurs si déjà init
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. VARIABLES GLOBALES ET ÉTAT
        // ==========================================
        let curCl = localStorage.getItem('os_last_cl') || null;
        let activeScoresListener = null;
        let chronoActive = false;
        const couleurs = ['NOIR', 'ROUGE', 'BLEU', 'VERT', 'JAUNE'];

        // Initialisation au lancement
        window.onload = () => {
            updateUIState();
            genererMatriceEnDur();
            if (curCl && curCl !== "true") ecouterClassement(curCl);
        };

        // Navigation des onglets
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function updateUIState() {
            document.getElementById('displayCurCl').innerText = (curCl && curCl !== "true") ? curCl : "Aucune";
        }

        // ==========================================
        // 3. MATRICE DES CODES EN DUR (Ergonomie conservée)
        // ==========================================
        // Tu peux modifier ces valeurs directement ici. Elles servent de base.
        const MATRICE_DEFAUT = {
            1: { NOIR: ["A1",""], ROUGE: ["B2",""], BLEU: ["C3",""], VERT: ["D4",""], JAUNE: ["E5",""] },
            2: { NOIR: ["F6",""], ROUGE: ["G7",""], BLEU: ["H8",""], VERT: ["I9",""], JAUNE: ["J0",""] },
            3: { NOIR: ["K1",""], ROUGE: ["L2",""], BLEU: ["M3",""], VERT: ["N4",""], JAUNE: ["O5",""] },
            4: { NOIR: ["P6",""], ROUGE: ["Q7",""], BLEU: ["R8",""], VERT: ["S9",""], JAUNE: ["T0",""] },
            5: { NOIR: ["U1",""], ROUGE: ["V2",""], BLEU: ["W3",""], VERT: ["X4",""], JAUNE: ["Y5",""] },
            6: { NOIR: ["Z6",""], ROUGE: ["A7",""], BLEU: ["B8",""], VERT: ["C9",""], JAUNE: ["D0",""] },
            7: { NOIR: ["E1",""], ROUGE: ["F2",""], BLEU: ["G3",""], VERT: ["H4",""], JAUNE: ["I5",""] },
            8: { NOIR: ["J6",""], ROUGE: ["K7",""], BLEU: ["L8",""], VERT: ["M9",""], JAUNE: ["N0",""] },
            9: { NOIR: ["O1",""], ROUGE: ["P2",""], BLEU: ["Q3",""], VERT: ["R4",""], JAUNE: ["S5",""] },
            10:{ NOIR: ["T6",""], ROUGE: ["U7",""], BLEU: ["V8",""], VERT: ["W9",""], JAUNE: ["X0",""] },
            11:{ NOIR: ["Y1",""], ROUGE: ["Z2",""], BLEU: ["A3",""], VERT: ["B4",""], JAUNE: ["C5",""] },
            12:{ NOIR: ["D6",""], ROUGE: ["E7",""], BLEU: ["F8",""], VERT: ["G9",""], JAUNE: ["H0",""] }
        };

        function genererMatriceEnDur() {
            let hHead = `<tr class="bg-slate-900 text-xs"><th>Balise</th>`;
            couleurs.forEach(col => hHead += `<th colspan="2" class="py-2 text-${col === 'NOIR' ? 'gray-400' : col.toLowerCase()+'-500'}">${col}</th>`);
            hHead += `</tr>`;
            document.getElementById('matrixHead').innerHTML = hHead;

            let hBody = "";
            for (let c = 1; c <= 12; c++) {
                hBody += `<tr class="border-b border-slate-800">
                            <td class="font-bold py-2">P${c}</td>`;
                couleurs.forEach(col => {
                    const l = MATRICE_DEFAUT[c][col];
                    // On écrit également en base au chargement pour s'assurer que Firebase est synchro avec la version en dur
                    db.ref(`settings/matrix/${c}/${col}`).set(l);
                    
                    hBody += `<td><input class="w-10 bg-transparent text-center font-bold text-blue-400 uppercase outline-none focus:bg-slate-700 rounded" value="${l[0]}" maxlength="2" onchange="updateMatrix(${c}, '${col}', 0, this.value)"></td>
                              <td><input class="w-10 bg-transparent text-center font-bold text-blue-400 uppercase outline-none focus:bg-slate-700 rounded border-l border-slate-700/50" value="${l[1]}" maxlength="2" onchange="updateMatrix(${c}, '${col}', 1, this.value)"></td>`;
                });
                hBody += `</tr>`;
            }
            document.getElementById('matrixBody').innerHTML = hBody;
        }

        function updateMatrix(poste, couleur, index, valeur) {
            db.ref(`settings/matrix/${poste}/${couleur}/${index}`).set(valeur.toUpperCase());
        }

        // ==========================================
        // 4. IMPORT CSV & RGPD
        // ==========================================
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                complete: function(results) { processCSVData(results.data); }
            });
        }

        function processCSVData(data) {
            if (data.length < 2) return alert("Fichier vide ou invalide.");
            const classe = data[1][4]; 
            if (!classe) return alert("Classe non trouvée dans le CSV.");

            const localDict = {}; 
            const firebasePayload = {}; 
            let studentCount = 0;

            for (let i = 1; i < data.length; i++) {
                const prenom = data[i][0];
                const nom = data[i][1];
                
                if (prenom && nom) {
                    const col = couleurs[studentCount % 5];
                    const num = Math.floor(studentCount / 5) + 1;
                    const code = `${col}_${num}`;

                    // Dictionnaire local (iPad)
                    localDict[code] = `${prenom.trim()} ${nom.trim().charAt(0).toUpperCase()}.`;
                    // Squelette Firebase
                    firebasePayload[code] = { score: 0, count: 0, lastScan: 0 };
                    studentCount++;
                }
            }

            localStorage.setItem(`os_dict_${classe}`, JSON.stringify(localDict));
            localStorage.setItem('os_last_cl', classe);
            curCl = classe;
            updateUIState();

            // Envoi atomique Firebase
            db.ref(`settings/classes/${classe}`).set(true);
            db.ref(`sessions/${classe}`).set(firebasePayload, (error) => {
                if(!error) {
                    alert(`Import réussi : ${studentCount} élèves ajoutés pour la classe ${classe}.`);
                    ecouterClassement(curCl);
                }
            });
        }

        // ==========================================
        // 5. GESTION DU CHRONO (START / STOP)
        // ==========================================
        function toggleChrono() {
            if (!curCl || curCl === "true") return alert("Sélectionnez/Importez une classe valide d'abord !");
            
            const btn = document.getElementById('btnChrono');
            const status = document.getElementById('chronoStatus');

            if (!chronoActive) {
                // START
                db.ref(`settings/startTime/${curCl}`).set(firebase.database.ServerValue.TIMESTAMP);
                db.ref(`settings/endTime/${curCl}`).remove();
                chronoActive = true;
                btn.innerHTML = "🛑 STOP (Verrouiller le jeu)";
                btn.classList.replace('bg-emerald-600', 'bg-red-600');
                btn.classList.replace('shadow-[0_0_20px_rgba(5,150,105,0.4)]', 'shadow-[0_0_20px_rgba(220,38,38,0.4)]');
                status.innerText = "Course en cours...";
                status.classList.replace('text-slate-400', 'text-emerald-400');
            } else {
                // STOP
                if(confirm("Arrêter la course ? Les élèves ne pourront plus saisir de codes.")) {
                    db.ref(`settings/endTime/${curCl}`).set(firebase.database.ServerValue.TIMESTAMP);
                    chronoActive = false;
                    btn.innerHTML = "⏱️ DÉMARRER LA SÉANCE";
                    btn.classList.replace('bg-red-600', 'bg-emerald-600');
                    btn.classList.replace('shadow-[0_0_20px_rgba(220,38,38,0.4)]', 'shadow-[0_0_20px_rgba(5,150,105,0.4)]');
                    status.innerText = "Course terminée / verrouillée.";
                    status.classList.replace('text-emerald-400', 'text-red-400');
                }
            }
        }

        // ==========================================
        // 6. LE PODIUM ET CLASSEMENT
        // ==========================================
        function ecouterClassement(classe) {
            if (!classe) return;
            if (activeScoresListener) activeScoresListener.off(); 

            activeScoresListener = db.ref(`sessions/${classe}`);
            activeScoresListener.on('value', snap => {
                mettreAJourPodium(snap.val() || {}, classe);
            });
        }

        function mettreAJourPodium(firebaseData, classe) {
            const dictRaw = localStorage.getItem(`os_dict_${classe}`);
            const dict = dictRaw ? JSON.parse(dictRaw) : {};

            const students = Object.keys(firebaseData).map(code => ({
                code: code,
                score: firebaseData[code].score || 0,
                lastScan: firebaseData[code].lastScan || 0,
                name: dict[code] || code 
            })).filter(s => s.score > 0); 

            // Tri : points décroissants, puis scan le plus ancien (le plus rapide à atteindre ce score)
            students.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.lastScan - b.lastScan; 
            });

            const top3 = students.slice(0, 3);
            const rest = students.slice(3);

            const podiumEl = document.getElementById('podiumContainer');
            if (top3.length > 0) {
                let podiumHTML = "";
                const hauteurs = ['h-32', 'h-44', 'h-24']; 
                const ordres = ['order-2', 'order-1', 'order-3']; 
                const couleursPodium = ['bg-slate-400', 'bg-yellow-500', 'bg-amber-700']; 
                const bgColors = ['bg-slate-700', 'bg-yellow-600/20', 'bg-amber-900/40'];

                top3.forEach((s, index) => {
                    const vIndex = index === 0 ? 1 : (index === 1 ? 0 : 2); 
                    podiumHTML += `
                        <div class="flex flex-col items-center justify-end ${ordres[vIndex]} w-28">
                            <span class="text-sm font-bold truncate w-full text-center mb-1 drop-shadow-md">${s.name}</span>
                            <span class="text-base font-black text-blue-400 mb-2">${s.score} pts</span>
                            <div class="w-full ${hauteurs[vIndex]} ${couleursPodium[vIndex]} rounded-t-xl flex flex-col items-center justify-start pt-3 shadow-2xl border-t-2 border-white/30 relative overflow-hidden">
                                <div class="absolute inset-0 ${bgColors[vIndex]} mix-blend-overlay"></div>
                                <span class="text-4xl font-black text-white/90 drop-shadow-lg z-10">${index + 1}</span>
                            </div>
                        </div>
                    `;
                });
                podiumEl.innerHTML = podiumHTML;
            } else {
                podiumEl.innerHTML = `<div class="text-slate-500 text-sm flex items-center justify-center h-full w-full">En attente des premiers scans...</div>`;
            }

            const listEl = document.getElementById('leaderboardList');
            let listHTML = "";
            rest.forEach((s, index) => {
                listHTML += `
                    <div class="flex items-center justify-between bg-slate-800/80 p-3 rounded-lg border border-slate-700 shadow-sm">
                        <div class="flex items-center gap-4">
                            <span class="text-slate-500 font-black w-6 text-right">${index + 4}.</span>
                            <span class="font-bold uppercase tracking-wide">${s.name}</span>
                        </div>
                        <div class="font-black text-blue-400 text-lg">${s.score} <span class="text-xs text-slate-500 font-normal">pts</span></div>
                    </div>
                `;
            });
            listEl.innerHTML = listHTML;
        }

        // ==========================================
        // 7. PURGE AUTOMATISÉE ET SÉCURISÉE
        // ==========================================
        function resetData(type) { 
            if(prompt("Code de sécurité (RNE) :") === "0680013V" && confirm("Action irréversible. Confirmer ?")) { 
                if(type === 'scores') { 
                    if(curCl && curCl !== "true") {
                        // Remise à zéro des scores en gardant les élèves
                        db.ref(`sessions/${curCl}`).once('value', snap => {
                            let updates = {};
                            snap.forEach(child => {
                                updates[child.key] = { score: 0, count: 0, lastScan: 0 };
                            });
                            db.ref(`sessions/${curCl}`).set(updates);
                        });
                        db.ref(`settings/startTime/${curCl}`).remove(); 
                        db.ref(`settings/endTime/${curCl}`).remove();
                    }
                } else { 
                    // Purge TOTALE Cloud
                    db.ref('sessions').remove(); 
                    db.ref('settings/classes').remove(); 
                    db.ref('settings/startTime').remove(); 
                    db.ref('settings/endTime').remove();
                    
                    // Nettoyage complet iPad
                    localStorage.clear();
                    curCl = null;
                } 
                location.reload(); 
            } 
        }
    </script>
</body>
</html>
