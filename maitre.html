<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Console | Orient'Show PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>if (sessionStorage.getItem("os_access") !== "granted") window.location.href = "index.html";</script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .tab-btn { flex: 1; padding: 20px; font-weight: 900; text-transform: uppercase; background: #1e293b; border-bottom: 5px solid transparent; transition: 0.3s; }
        .tab-active { background: #3b82f6; border-color: white; }
        .pastille { width: 55px; height: 55px; border-radius: 50%; border: 3px solid #000; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: white; }
        #m-mountain { position: relative; width: 100%; height: 65vh; background: #1e293b; border-radius: 1.5rem; overflow: hidden; border: 1px solid #334155; 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M0 1000 L300 400 L500 600 L700 200 L1000 1000 Z" fill="%230f172a" opacity="0.5"/></svg>'); background-size: cover; background-position: bottom;
        }
        .m-line { position: absolute; left: 0; width: 100%; border-top: 1px dashed rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); font-size: 10px; padding-left: 10px; }
        .m-pion { position: absolute; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; transition: all 1s; z-index: 10; color: white; }
        .m-pion-name { position: absolute; top: 110%; font-size: 9px; font-weight: 900; white-space: nowrap; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; color: white !important; border: 1px solid rgba(255,255,255,0.1); }
        .btn-chrono { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4">

    <header class="flex flex-col lg:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4 uppercase font-black italic">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl text-blue-500 tracking-tighter">Orient'Show Master</h1>
            <button id="btnChrono" onclick="startChrono()" class="hidden bg-green-600 px-6 py-2 rounded-full text-sm btn-chrono shadow-[0_0_20px_rgba(22,163,74,0.5)]">🚀 TOP DÉPART</button>
            <div id="chronoDisplay" class="hidden text-2xl font-mono text-yellow-400">00:00</div>
        </div>
        
        <div class="flex items-center gap-2">
            <select id="activeClasse" onchange="loadClasse()" class="bg-slate-800 p-2 rounded-lg border border-slate-700 min-w-[160px] text-white"></select>
            <button onclick="addClasse()" class="bg-blue-600 w-10 h-10 rounded-full text-xl shadow-lg hover:bg-blue-500">+</button>
        </div>

        <div class="flex gap-2">
            <button onclick="document.getElementById('csv').click()" class="bg-slate-700 px-4 py-2 rounded-lg text-[10px]">Import CSV</button>
            <input type="file" id="csv" class="hidden" accept=".csv" onchange="importCSV(this)">
            <button onclick="resetData('scores')" class="bg-red-600 px-3 py-2 text-[10px]">Vider Scores</button>
            <button onclick="resetData('base')" class="bg-red-900 px-3 py-2 text-[10px]">Purger Classes</button>
        </div>
    </header>

    <nav class="flex gap-2 mb-6">
        <button onclick="switchTab('bilan')" id="btnTabBilan" class="tab-btn tab-active">📊 Bilan</button>
        <button onclick="switchTab('carte')" id="btnTabCarte" class="tab-btn">🏔️ Carte</button>
        <button onclick="switchTab('groupes')" id="btnTabGroupes" class="tab-btn">👥 Groupes</button>
        <button id="btnTabCodes" onclick="switchTab('codes')" class="tab-btn !flex-none !w-24 text-[10px]">📝 Codes</button>
    </nav>

    <div id="viewBilan" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="viewGroupes" class="hidden grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="viewCarte" class="hidden"><div id="m-mountain"><script>for(let s=0; s<=60; s+=10) { const pos = 90 - (s * (75/60)); document.write(`<div class="m-line" style="top: ${pos}%;">${s} PTS</div>`); }</script><div id="m-players-layer"></div></div></div>
    <div id="viewCodes" class="hidden overflow-auto border border-slate-700 rounded-xl"><table class="w-full text-xs text-center uppercase font-bold" id="matrixTable"></table></div>

    <div id="modalDetails" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-xl rounded-3xl p-6 border border-slate-700">
            <div class="flex justify-between items-start mb-6"><h2 id="mName" class="text-2xl font-black text-blue-400 italic"></h2><button onclick="document.getElementById('modalDetails').classList.add('hidden')" class="text-4xl">&times;</button></div>
            <div id="mHistory" class="space-y-2 max-h-[60vh] overflow-auto"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const colors = ["NOIR", "ROUGE", "BLEU", "VERT", "JAUNE"];
        const colStyles = { NOIR:"bg-black", ROUGE:"bg-red-600", BLEU:"bg-blue-600", VERT:"bg-green-600", JAUNE:"bg-yellow-500 text-black" };
        
        let mapping = JSON.parse(localStorage.getItem('os_map_v6') || '{}'), curCl = localStorage.getItem('os_last_cl') || "", results = {};

        const myCodes = {
            1: { NOIR:["D","Q"], ROUGE:["O","U"], BLEU:["Y","A"], VERT:["E","R"], JAUNE:["N","K"] },
            2: { NOIR:["E","X"], ROUGE:["X","Y"], BLEU:["T","L"], VERT:["R","O"], JAUNE:["A","L"] },
            3: { NOIR:["C","L"], ROUGE:["H","U"], BLEU:["I","B"], VERT:["O","I"], JAUNE:["T","E"] },
            4: { NOIR:["R","V"], ROUGE:["E","E"], BLEU:["C","R"], VERT:["T","N"], JAUNE:["O","I"] },
            5: { NOIR:["A","B"], ROUGE:["J","O"], BLEU:["O","U"], VERT:["N","E"], JAUNE:["C","S"] },
            6: { NOIR:["F","M"], ROUGE:["I","E"], BLEU:["C","R"], VERT:["U","O"], JAUNE:["S","U"] },
            7: { NOIR:["G","H"], ROUGE:["U","A"], BLEU:["E","C"], VERT:["U","H"], JAUNE:["X","E"] },
            8: { NOIR:["I","J"], ROUGE:["V","E"], BLEU:["R","A"], VERT:["E","N"], JAUNE:["S","S"] },
            9: { NOIR:["K","N"], ROUGE:["R","Y"], BLEU:["A","L"], VERT:["F","O"], JAUNE:["T","N"] },
            10: { NOIR:["O","S"], ROUGE:["C","E"], BLEU:["E","I"], VERT:["A","Z"], JAUNE:["N","E"] },
            11: { NOIR:["P","T"], ROUGE:["A","U"], BLEU:["L","Y"], VERT:["U","A"], JAUNE:["D","U"] },
            12: { NOIR:["U","W"], ROUGE:["L","I"], BLEU:["T","N"], VERT:["R","C"], JAUNE:["A","H"] }
        };

        db.ref('settings/matrix').once('value', snap => { if (!snap.exists()) db.ref('settings/matrix').set(myCodes); });

        db.ref('settings/classes').on('value', snap => {
            const clArr = Object.keys(snap.val() || {}).filter(c => c !== "null");
            document.getElementById('activeClasse').innerHTML = clArr.map(c => `<option value="${c}" ${c===curCl?'selected':''}>${c}</option>`).join('');
            if(!curCl && clArr.length > 0) { curCl = clArr[0]; loadClasse(); }
        });

        function loadClasse() {
            curCl = document.getElementById('activeClasse').value; if(!curCl) return;
            localStorage.setItem('os_last_cl', curCl); 
            db.ref('settings/activeClassName').set(curCl);
            
            // Gestion du chrono
            db.ref(`settings/startTime/${curCl}`).on('value', snap => {
                const start = snap.val();
                if(!start) {
                    document.getElementById('btnChrono').classList.remove('hidden');
                    document.getElementById('chronoDisplay').classList.add('hidden');
                } else {
                    document.getElementById('btnChrono').classList.add('hidden');
                    document.getElementById('chronoDisplay').classList.remove('hidden');
                    setInterval(() => {
                        const sec = Math.floor((Date.now() - start) / 1000);
                        document.getElementById('chronoDisplay').innerText = new Date(sec * 1000).toISOString().substr(14, 5);
                    }, 1000);
                }
            });

            db.ref(`sessions/${curCl}`).on('value', snap => { results = snap.val() || {}; updateUI(); });
        }

        function startChrono() { if(confirm("Lancer le chrono pour toute la classe ?")) db.ref(`settings/startTime/${curCl}`).set(Date.now()); }

        function updateUI() {
            const list = mapping[curCl] || []; const bil = document.getElementById('viewBilan'); const grp = document.getElementById('viewGroupes'); const mtn = document.getElementById('m-players-layer');
            bil.innerHTML = ""; grp.innerHTML = ""; mtn.innerHTML = "";
            let scores = list.map(s => Object.values(results[s.code] || {}).reduce((a,b)=>a+b.score, 0)).sort((a,b)=>b-a);
            const q1 = scores[Math.floor(scores.length*0.25)] || 0;

            list.sort((a,b)=>a.last.localeCompare(b.last)).forEach((s, i) => {
                const pts = Object.values(results[s.code] || {}).reduce((a,b)=>a+b.score, 0);
                let bg = pts >= q1 && pts > 0 ? "bg-green-600" : pts > 0 ? "bg-yellow-500 text-black" : "bg-slate-800";
                
                // BILAN (Grille de 5)
                bil.innerHTML += `<div onclick="openModal('${s.last} ${s.first}','${s.code}')" class="${bg} p-4 rounded-2xl cursor-pointer text-center shadow-lg border border-white/5"><div class="flex justify-between font-black"><span class="pastille ${colStyles[s.code.split('_')[0]]} !w-10 !h-10 !text-sm">${s.code.split('_')[1]}</span><span class="text-2xl">${pts}</span></div><p class="text-lg font-black mt-2 truncate leading-none">${s.first}</p></div>`;
                
                // GROUPES (Grille de 5)
                grp.innerHTML += `<div class="bg-slate-800 p-4 rounded-2xl text-center border border-slate-700"><div class="pastille ${colStyles[s.code.split('_')[0]]} mx-auto mb-2 !w-12 !h-12 !text-lg">${s.code.split('_')[1]}</div><p class="font-bold text-[10px] truncate uppercase opacity-50">${s.last}</p><p class="font-black text-xs truncate mb-2">${s.first}</p><select onchange="changeCode('${s.id}', this.value)" class="bg-slate-900 p-1 rounded text-[10px] w-full border border-slate-700 text-white"><option value="ABS" ${s.absent?'selected':''}>ABSENT</option>${colors.flatMap(c => [...Array(10).keys()].map(n => `<option value="${c}_${n+1}" ${s.code==`${c}_${n+1}`?'selected':''}>${c} ${n+1}</option>`)).join('')}</select></div>`;
                
                if(!s.absent) {
                    const pion = document.createElement('div'); pion.className = `m-pion ${colStyles[s.code.split('_')[0]]}`;
                    pion.style.top = `${90 - (Math.min(60, pts) * (75/60))}%`; pion.style.left = `${5 + (i * (90/list.length))}%`;
                    pion.innerHTML = `${s.code.split('_')[1]}<span class="m-pion-name">${s.first}</span>`; mtn.appendChild(pion);
                }
            });
        }

        // --- Fonctions utilitaires ---
        function switchTab(t) { ['viewBilan','viewGroupes','viewCarte','viewCodes'].forEach(v => document.getElementById(v).classList.add('hidden')); document.getElementById('view'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active')); document.getElementById('btnTab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('tab-active'); }
        function addClasse() { const n = prompt("Nom :"); if(n) { const clean = n.toUpperCase(); db.ref(`settings/classes/${clean}`).set(true); if(!mapping[clean]) mapping[clean] = []; localStorage.setItem('os_map_v6', JSON.stringify(mapping)); location.reload(); } }
        function changeCode(id, val) { const s = mapping[curCl].find(x => x.id == id); s.absent = (val === "ABS"); if(!s.absent) s.code = val; localStorage.setItem('os_map_v6', JSON.stringify(mapping)); updateUI(); }
        function importCSV(input) { Papa.parse(input.files[0], { header: true, complete: res => { const colNom = res.meta.fields.find(c => c.toLowerCase().includes('lastname')); const colPre = res.meta.fields.find(c => c.toLowerCase().includes('name') && !c.toLowerCase().includes('last')); if(!colNom || !colPre) return alert("CSV Invalide"); const data = res.data.filter(r => r[colNom]); const cName = (data[0]['@classe'] || prompt("Nom ?")).toUpperCase(); mapping[cName] = data.map((r, i) => ({ id: Date.now()+i, last: r[colNom].toUpperCase(), first: r[colPre], code: `${colors[i % 5]}_${Math.floor(i / 5) + 1}`, absent: false })); db.ref(`settings/classes/${cName}`).set(true); localStorage.setItem('os_map_v6', JSON.stringify(mapping)); location.reload(); }}); }
        function openModal(n, c) { document.getElementById('mName').innerText = n; document.getElementById('modalDetails').classList.remove('hidden'); db.ref(`sessions/${curCl}/${c}`).once('value', snap => { const res = snap.val() || {}; document.getElementById('mHistory').innerHTML = Object.entries(res).map(([k, v]) => `<div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center border border-slate-700 font-bold"><span>P${k.replace('C','')} - ${v.score} pts</span><button onclick="if(confirm('Sûr?')) db.ref('sessions/${curCl}/${c}/${k}').remove().then(()=>document.getElementById('modalDetails').classList.add('hidden'))" class="bg-red-600 px-3 rounded text-[10px] uppercase">Suppr</button></div>`).join('') || "Rien"; }); }

        db.ref('settings/matrix').on('value', snap => {
            let matrix = snap.val() || {}; let html = `<tr class="bg-slate-900 text-[10px]"><th>#</th><th colspan="2">NOIR</th><th colspan="2">ROUGE</th><th colspan="2">BLEU</th><th colspan="2">VERT</th><th colspan="2">JAUNE</th></tr>`;
            for(let c=1; c<=12; c++) {
                html += `<tr class="border-b border-slate-800"><td>P${c}</td>`;
                colors.forEach(col => { const l = matrix[c]?.[col] || ["",""]; html += `<td class="p-1"><input class="w-8 bg-slate-900/50 text-center font-bold text-blue-400 border border-white/5 rounded" value="${l[0]}" onchange="db.ref('settings/matrix/${c}/${col}/0').set(this.value.toUpperCase())"></td><td class="p-1 border-r border-slate-800"><input class="w-8 bg-slate-900/50 text-center font-bold text-blue-400 border border-white/5 rounded" value="${l[1]}" onchange="db.ref('settings/matrix/${c}/${col}/1').set(this.value.toUpperCase())"></td>`; });
                html += `</tr>`;
            }
            document.getElementById('matrixTable').innerHTML = html;
        });

        function resetData(type) { 
            if(prompt("RNE (0680013V) :")==="0680013V" && confirm("Sûr ?")) { 
                if(type==='scores') db.ref(`sessions/${curCl}`).remove(); 
                else { 
                    db.ref('sessions').remove();
                    db.ref('settings/classes').remove();
                    db.ref('settings/activeClassName').remove();
                    db.ref('settings/startTime').remove();
                    localStorage.clear(); 
                } 
                location.reload(); 
            } 
        }
    </script>
</body>
</html>
