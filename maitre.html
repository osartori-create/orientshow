<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master PRO v2 | Orient'Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>if (sessionStorage.getItem("os_access") !== "granted") window.location.href = "index.html";</script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .tab-btn { flex: 1; padding: 15px; font-weight: 900; text-transform: uppercase; background: #1e293b; transition: 0.3s; border-bottom: 4px solid transparent; }
        .tab-active { background: #3b82f6; border-color: white; }
    </style>
</head>
<body class="pb-20">

    <div class="sticky top-0 z-50 bg-[#0f172a] shadow-xl">
        <div class="p-4 flex justify-between items-center border-b border-slate-800">
            <h1 class="text-xl font-black italic text-blue-500">ORIENT'SHOW <span class="text-white text-sm">MASTER</span></h1>
            <div class="flex items-center gap-2">
                <select id="selectClasse" onchange="switchClasse(this.value)" class="bg-slate-800 border border-slate-700 rounded px-3 py-1 font-bold text-blue-400"></select>
            </div>
        </div>
        <div class="flex">
            <button onclick="showTab('bilan')" id="btn-bilan" class="tab-btn tab-active">📊 Bilan</button>
            <button onclick="showTab('codes')" id="btn-codes" class="tab-btn">🔑 Codes</button>
            <button onclick="showTab('admin')" id="btn-admin" class="tab-btn">⚙️ Admin</button>
        </div>
    </div>

    <div id="tab-bilan" class="p-4 space-y-4">
        <div class="flex justify-between items-center">
            <button onclick="startSession()" class="bg-green-600 px-6 py-3 rounded-xl font-bold uppercase shadow-lg active:scale-95">▶️ Top Départ</button>
            <button onclick="exportIdoceo()" class="bg-slate-700 px-4 py-2 rounded-xl font-bold text-sm">📥 iDoceo CSV</button>
        </div>
        <div id="bilanList" class="grid grid-cols-1 gap-2"></div>
    </div>

    <div id="tab-codes" class="hidden p-4">
        <div class="bg-slate-800 rounded-2xl p-4 overflow-x-auto">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="text-[10px] uppercase text-slate-400 border-b border-slate-700">
                        <th class="py-2">P#</th><th class="text-white">Noir</th><th class="text-red-500">Rouge</th><th class="text-blue-500">Bleu</th><th class="text-green-500">Vert</th><th class="text-yellow-400">Jaune</th>
                    </tr>
                </thead>
                <tbody id="matrixBody"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-admin" class="hidden p-4 space-y-6">
        <div class="bg-slate-800 p-4 rounded-2xl">
            <h3 class="font-bold mb-4 uppercase text-blue-400">Importation Classe</h3>
            <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
        </div>
        <div class="flex flex-col gap-2">
            <button onclick="resetData('current')" class="bg-orange-900/40 text-orange-200 p-4 rounded-xl font-bold border border-orange-900">Vider scores de la classe</button>
            <button onclick="resetData('all')" class="bg-red-900 text-white p-4 rounded-xl font-bold">⚠️ RESET TOTAL (Firebase + iPad)</button>
        </div>
    </div>

    <script>
        // --- TA MATRICE PHYSIQUE EXTRAITE DE L'IMAGE ---
        const MA_MATRICE_PHYSIQUE = {
            1:  { NOIR: "AL", ROUGE: "KC", BLEU: "NT", VERT: "PV", JAUNE: "XF" },
            2:  { NOIR: "BM", ROUGE: "LD", BLEU: "OU", VERT: "QW", JAUNE: "YG" },
            3:  { NOIR: "CN", ROUGE: "ME", BLEU: "PV", VERT: "RX", JAUNE: "ZH" },
            4:  { NOIR: "DO", ROUGE: "NF", BLEU: "QW", VERT: "SY", JAUNE: "AI" },
            5:  { NOIR: "EP", ROUGE: "OG", BLEU: "RX", VERT: "TZ", JAUNE: "BJ" },
            6:  { NOIR: "FQ", ROUGE: "PH", BLEU: "SY", VERT: "UA", JAUNE: "CK" },
            7:  { NOIR: "GR", ROUGE: "QI", BLEU: "TZ", VERT: "VB", JAUNE: "DL" },
            8:  { NOIR: "HS", ROUGE: "RJ", BLEU: "UA", VERT: "WC", JAUNE: "EM" },
            9:  { NOIR: "IT", ROUGE: "SK", BLEU: "VB", VERT: "XD", JAUNE: "FN" },
            10: { NOIR: "JU", ROUGE: "TL", BLEU: "WC", VERT: "YE", JAUNE: "GO" },
            11: { NOIR: "KV", ROUGE: "UM", BLEU: "XD", VERT: "ZF", JAUNE: "HP" },
            12: { NOIR: "LW", ROUGE: "VN", BLEU: "YE", VERT: "AG", JAUNE: "IQ" }
        };

        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curCl = localStorage.getItem('curCl') || "";
        const colors = ['NOIR', 'ROUGE', 'BLEU', 'VERT', 'JAUNE'];

        function init() {
            db.ref('settings/classes').on('value', snap => {
                const list = snap.val() || [];
                const select = document.getElementById('selectClasse');
                select.innerHTML = list.map(c => `<option value="${c}" ${c===curCl?'selected':''}>${c}</option>`).join('');
                if(!curCl && list.length > 0) switchClasse(list[0]);
                else setupListeners();
            });
        }

        function switchClasse(val) {
            curCl = val;
            localStorage.setItem('curCl', val);
            setupListeners();
        }

        function setupListeners() {
            if(!curCl) return;
            const mRef = db.ref(`classes/${curCl}/matrix`);
            mRef.once('value', s => { if(!s.exists()) mRef.set(MA_MATRICE_PHYSIQUE); });
            mRef.on('value', snap => renderMatrix(snap.val()));
            db.ref(`classes/${curCl}/results`).on('value', snap => renderBilan(snap.val()));
            db.ref(`classes/${curCl}/absents`).on('value', snap => { window.absents = snap.val() || {}; renderBilan(); });
        }

        function renderBilan(data = {}) {
            const mapping = JSON.parse(localStorage.getItem(`map_${curCl}`) || "[]");
            let html = "";
            mapping.forEach((name, i) => {
                const col = colors[i % 5], num = Math.floor(i / 5) + 1, uKey = `${col}_${num}`;
                const res = data[uKey] || {}, pts = Object.values(res).reduce((a, b) => a + (b.score || 0), 0);
                const nbVal = Object.keys(res).length, isAbs = window.absents && window.absents[uKey];
                html += `<div class="bg-slate-800 p-3 rounded-xl flex items-center gap-3 ${isAbs?'opacity-30':''}">
                    <div class="w-10 h-10 rounded-full bg-${col.toLowerCase()==='noir'?'black':col.toLowerCase()+'-600'} border-2 border-white/20 flex items-center justify-center font-black text-[10px]">${num}</div>
                    <div class="flex-1 min-w-0"><div class="font-bold text-xs uppercase truncate">${name}</div><div class="text-[10px] text-blue-400">${nbVal} balises | ${pts} pts</div></div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" ${isAbs?'checked':''} onchange="toggleAbsent('${uKey}', this.checked)" class="w-5 h-5">
                        <button onclick="undoLast('${uKey}')" class="bg-slate-700 w-8 h-8 rounded text-sm">↩️</button>
                    </div></div>`;
            });
            document.getElementById('bilanList').innerHTML = html || "<p class='text-center opacity-50'>Importez un CSV iDoceo.</p>";
        }

        function renderMatrix(m = {}) {
            let h = "";
            for(let p=1; p<=12; p++) {
                h += `<tr class="border-b border-slate-700/50"><td class="bg-slate-900 font-bold text-xs py-2">P${p}</td>`;
                colors.forEach(c => {
                    const val = (m[p] && m[p][c]) ? m[p][c] : "";
                    h += `<td><input maxlength="2" class="w-8 bg-transparent text-center font-bold text-blue-400 uppercase text-xs" value="${val}" onchange="updateMatrix(${p},'${c}',this.value)"></td>`;
                });
                h += `</tr>`;
            }
            document.getElementById('matrixBody').innerHTML = h;
        }

        function updateMatrix(p, c, v) { db.ref(`classes/${curCl}/matrix/${p}/${c}`).set(v.toUpperCase()); }
        function toggleAbsent(k, s) { db.ref(`classes/${curCl}/absents/${k}`).set(s ? true : null); }
        function undoLast(k) { if(confirm("Supprimer la dernière validation ?")) db.ref(`classes/${curCl}/results/${k}`).limitToLast(1).once('value', s => s.forEach(c => c.ref.remove())); }
        function startSession() { db.ref(`classes/${curCl}/settings/startTime`).set(Date.now()); alert("Course lancée !"); }

        function exportIdoceo() {
            const mapping = JSON.parse(localStorage.getItem(`map_${curCl}`) || "[]");
            db.ref(`classes/${curCl}/results`).once('value', snap => {
                const data = snap.val() || {};
                let csv = "Nom,Prenom,Points,Balises\n";
                mapping.forEach((name, i) => {
                    const uKey = `${colors[i%5]}_${Math.floor(i/5)+1}`, res = data[uKey] || {};
                    const pts = Object.values(res).reduce((a, b) => a + (b.score || 0), 0);
                    csv += `${name.replace(' ',',')},${pts},${Object.keys(res).length}\n`;
                });
                const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv); a.download = `Export_${curCl}.csv`; a.click();
            });
        }

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0], className = prompt("Nom de la classe :");
            if(!className) return;
            Papa.parse(file, { header: true, complete: function(res) {
                const names = res.data.filter(r => r.Nom).map(r => `${r.Nom} ${r.Prenom || ''}`);
                localStorage.setItem(`map_${className}`, JSON.stringify(names));
                db.ref('settings/classes').once('value', s => {
                    let l = s.val() || []; if(!l.includes(className)) l.push(className);
                    db.ref('settings/classes').set(l).then(() => switchClasse(className));
                });
            }});
        });

        function showTab(id) {
            ['bilan', 'codes', 'admin'].forEach(t => { 
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('tab-active');
            });
            document.getElementById(`tab-${id}`).classList.remove('hidden');
            document.getElementById(`btn-${id}`).classList.add('tab-active');
        }

        function resetData(type) {
            if(prompt("Code RNE :") !== "0680013V") return;
            if(type === 'current') db.ref(`classes/${curCl}`).remove();
            else { db.ref().remove(); localStorage.clear(); }
            location.reload();
        }
        init();
    </script>
</body>
</html>
