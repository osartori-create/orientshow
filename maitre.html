<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orient'Show | Maître</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .tab-btn { flex: 1; padding: 20px; font-weight: 900; text-transform: uppercase; background: #1e293b; border-bottom: 5px solid transparent; }
        .tab-active { background: #3b82f6; border-color: white; }
        .pastille { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #000; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; }
        #m-mountain { position: relative; width: 100%; height: 70vh; background: #1e293b; border-radius: 1rem; overflow: hidden; }
        .m-pion { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #000; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; transition: all 1s; }
        .m-name { position: absolute; top: 110%; font-size: 8px; white-space: nowrap; background: rgba(0,0,0,0.5); padding: 2px; }
    </style>
</head>
<body class="p-4">
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <h1 class="text-3xl font-black italic text-blue-500 uppercase">Orient'Show Maître</h1>
        <div class="flex gap-2">
            <select id="activeClasse" onchange="loadClasse()" class="bg-slate-800 p-2 rounded-lg font-bold"></select>
            <button onclick="addClasse()" class="bg-blue-600 w-10 h-10 rounded-full font-black">+</button>
        </div>
        <div class="flex gap-2">
            <button onclick="document.getElementById('csv').click()" class="bg-slate-700 px-4 py-2 rounded-lg text-xs font-bold uppercase">Import iDoceo</button>
            <input type="file" id="csv" class="hidden" accept=".csv" onchange="importCSV(this)">
            <button onclick="resetData('scores')" class="bg-red-600 px-4 py-2 rounded-lg text-xs font-bold uppercase">Vider Scores</button>
            <button onclick="resetData('base')" class="bg-red-900 px-4 py-2 rounded-lg text-xs font-bold uppercase">Purger Base</button>
        </div>
    </header>

    <nav class="flex gap-2 mb-6">
        <button onclick="switchTab('bilan')" id="btnTabBilan" class="tab-btn tab-active">📊 Bilan</button>
        <button onclick="switchTab('groupes')" id="btnTabGroupes" class="tab-btn">👥 Groupes</button>
        <button onclick="switchTab('carte')" id="btnTabCarte" class="tab-btn">🏔️ Carte</button>
        <button onclick="switchTab('codes')" id="btnTabCodes" class="tab-btn !flex-none !w-24 text-[10px]">📝 Codes</button>
    </nav>

    <div id="viewBilan" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    <div id="viewGroupes" class="hidden grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="viewCarte" class="hidden"><div id="m-mountain"></div></div>
    <div id="viewCodes" class="hidden overflow-auto"><table class="w-full text-xs" id="matrixTable"></table></div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const colors = ["NOIR", "ROUGE", "BLEU", "VERT", "JAUNE"];
        let mapping = JSON.parse(localStorage.getItem('os_map') || '{}'), curCl = "", results = {};

        db.ref('settings/classes').on('value', snap => {
            const clArr = Object.keys(snap.val() || {}).filter(c => isNaN(c));
            document.getElementById('activeClasse').innerHTML = clArr.map(c => `<option value="${c}">${c}</option>`).join('');
            if(!curCl && clArr.length > 0) curCl = clArr[0]; loadClasse();
        });

        function addClasse() { const n = prompt("Nom :"); if(n) { const clean = n.toUpperCase(); db.ref(`settings/classes/${clean}`).set(true); if(!mapping[clean]) mapping[clean] = []; localStorage.setItem('os_map', JSON.stringify(mapping)); location.reload(); } }

        function importCSV(input) {
            Papa.parse(input.files[0], { header: true, complete: res => {
                const data = res.data.filter(r => r['@lastname']); const cName = (data[0]['@classe'] || prompt("Nom ?")).toUpperCase();
                mapping[cName] = data.map((r, i) => ({ id: i+Date.now(), last: r['@lastname'].toUpperCase(), first: r['@name'], code: `${colors[i % 5]}_${Math.floor(i / 5) + 1}` }));
                db.ref(`settings/classes/${cName}`).set(true); localStorage.setItem('os_map', JSON.stringify(mapping)); location.reload();
            }});
        }

        function loadClasse() {
            curCl = document.getElementById('activeClasse').value; if(!curCl) return;
            db.ref('settings/activeClassName').set(curCl);
            db.ref(`sessions/${curCl}`).on('value', snap => { results = snap.val() || {}; updateUI(); });
        }

        function updateUI() {
            const list = mapping[curCl] || []; const bil = document.getElementById('viewBilan'); const grp = document.getElementById('viewGroupes'); const mtn = document.getElementById('m-mountain');
            bil.innerHTML = ""; grp.innerHTML = ""; mtn.innerHTML = "";
            list.forEach((s, i) => {
                const pts = Object.values(results[s.code] || {}).reduce((a,b)=>a+b.score, 0);
                bil.innerHTML += `<div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center"><div class="flex justify-between font-black"><span class="pastille bg-${s.code.split('_')[0].toLowerCase()}">${s.code.split('_')[1]}</span><span class="text-3xl">${pts}</span></div><p class="text-xl font-black text-blue-400 mt-2">${s.first}</p></div>`;
                grp.innerHTML += `<div class="bg-slate-800 p-4 rounded-2xl text-center"><div class="pastille bg-${s.code.split('_')[0].toLowerCase()} mx-auto mb-2">${s.code.split('_')[1]}</div><p class="font-bold">${s.last} ${s.first}</p></div>`;
                const pion = document.createElement('div'); pion.className = `m-pion bg-${s.code.split('_')[0].toLowerCase()}`; pion.style.bottom = `${10+(pts*1.33)}%`; pion.style.left = `${5+(i*(90/list.length))}%`; pion.innerText = s.code.split('_')[1]; pion.innerHTML += `<span class="m-name">${s.first}</span>`; mtn.appendChild(pion);
            });
        }

        function switchTab(t) { ['viewBilan','viewGroupes','viewCarte','viewCodes'].forEach(v => document.getElementById(v).classList.add('hidden')); document.getElementById('view'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active')); document.getElementById('btnTab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('tab-active'); }
        function resetData(type) { if(prompt("RNE :")==="0680013V" && confirm("Sûr ?")) { if(type==='scores') db.ref(`sessions/${curCl}`).remove(); else { db.ref().remove(); localStorage.clear(); } location.reload(); } }
    </script>
</body>
</html>
