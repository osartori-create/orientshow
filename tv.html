<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orient'Show | Mur de Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; overflow: hidden; }
        #mountain-container {
            position: relative; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M0 1000 L300 400 L500 100 L700 500 L1000 1000 Z" fill="%231e293b"/><path d="M0 1000 L200 800 L400 900 L600 200 L800 700 L1000 1000 Z" fill="%230f172a" opacity="0.5"/></svg>');
            background-size: cover; background-position: bottom;
        }
        .score-line { position: absolute; left: 0; width: 100%; border-top: 1px dashed rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); font-size: 14px; font-weight: 900; padding-left: 20px; transform: translateY(-50%); }
        .player-pion { position: absolute; width: 45px; height: 45px; border-radius: 50%; border: 3px solid #000; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10; }
        .bg-noir { background-color: black; border-color: #475569; }
        .bg-rouge { background-color: #ef4444; }
        .bg-bleu { background-color: #3b82f6; }
        .bg-vert { background-color: #22c55e; }
        .bg-jaune { background-color: #eab308; color: black; }
    </style>
</head>
<body>
    <header class="absolute top-0 left-0 w-full z-100 p-6 flex justify-between items-center bg-gradient-to-b from-slate-950 to-transparent">
        <div><h1 class="text-3xl font-black italic text-blue-500 uppercase tracking-tighter">L'ASCENSION <span class="text-white">ORIENT'SHOW</span></h1><p id="classeDisplay" class="text-blue-400 font-bold uppercase tracking-widest"></p></div>
        <div class="text-right text-xl font-black text-yellow-500 italic">OBJECTIF 60 PTS 🏆</div>
    </header>

    <div id="mountain-container">
        <script>for(let s=0; s<=60; s+=10) { const pos = 90 - (s * (75/60)); document.write(`<div class="score-line" style="top: ${pos}%;">${s} PTS</div>`); }</script>
        <div id="players-layer"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://orientshow-3a86f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        
        db.ref('settings/activeClassName').on('value', snap => {
            const cl = snap.val(); if(!cl) return;
            document.getElementById('classeDisplay').innerText = "Classe : " + cl;
            db.ref(`sessions/${cl}`).on('value', snap => {
                const results = snap.val() || {}; const container = document.getElementById('players-layer');
                container.innerHTML = "";
                Object.keys(results).forEach((uKey, i) => {
                    const pts = Object.values(results[uKey]).reduce((a,b) => a + b.score, 0);
                    const [col, num] = uKey.split('_');
                    const pion = document.createElement('div');
                    pion.className = `player-pion bg-${col.toLowerCase()}`;
                    pion.style.top = `${90 - (Math.min(60, pts) * (75/60))}%`;
                    pion.style.left = `${5 + (i * (90 / Math.max(1, Object.keys(results).length)))}%`;
                    pion.innerText = num; container.appendChild(pion);
                });
            });
        });
    </script>
</body>
</html>
